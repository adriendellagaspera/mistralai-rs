[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-to-rust-bindings"
version = "0.1.1"
description = "Normalize openapi-to-rust generated sources into rust-sdk-compiler Bindings"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT OR Apache-2.0"}
dependencies = [
  "rust-sdk-compiler @ git+https://github.com/adriendellagaspera/mistralai-rs.git@1bed0ed0b05eeeb0ca9d9b937d62c729cb7234aa",
  "tree-sitter==0.25.2",
  "tree-sitter-rust==0.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["openapi_to_rust_bindings"]

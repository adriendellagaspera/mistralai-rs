[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rust-sdk-compiler"
version = "0.2.4"
description = "Deterministic compiler for idiomatic Rust SDK surfaces from OpenAPI, normalized bindings, and explicit policy"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT OR Apache-2.0"}
dependencies = [
  "ruamel.yaml==0.18.6",
  "jsonschema==4.23.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["rust_sdk_compiler"]
include-package-data = true

[tool.setuptools.package-data]
rust_sdk_compiler = ["*.json"]

[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-to-rust-bindings"
version = "0.2.1"
description = "Load openapi-to-rust binding metadata into rust-sdk-compiler Bindings"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT OR Apache-2.0"}
dependencies = [
  "rust-sdk-compiler @ git+https://github.com/adriendellagaspera/mistralai-rs.git@8357b0e487bd06898099f687c9918a0c5db02db4",
  "tree-sitter==0.25.2",
  "tree-sitter-rust==0.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["openapi_to_rust_bindings"]

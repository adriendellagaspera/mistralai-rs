[generator]
spec_path = "../sources/openapi/openapi.yaml"
overlays = ["mistral.openapi.overlay.yaml"]
overlay_output = "../sources/openapi/openapi.overlaid.json"
output_dir = "../../src/generated"
module_name = "mistralai"

[features]
enable_async_client = true

[http_client]
base_url = "https://api.mistral.ai"

[http_client.retry]
# Avoid transparently retrying billable POST requests.
max_retries = 0

[http_client.auth]
type = "Bearer"
header_name = "Authorization"

[client]
prune_models = false

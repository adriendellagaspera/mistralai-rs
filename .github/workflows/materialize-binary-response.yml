name: Materialize binary response primitive
on:
  push:
    branches: [feat/binary-success-responses]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: materialize-binary-response
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'codegen.lock') }}
      - name: Apply generic binary response primitive
        run: python scripts/apply_binary_response.py
      - name: Regenerate SDK
        run: python scripts/codegen.py generate
      - name: Refresh probe baseline if projection set changed
        run: |
          PYTHON=$(find .tools -path '*python-sdk-codegen*/bin/python' | head -1)
          "$PYTHON" - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'codegen'))
          sys.path.insert(0, str(ROOT / 'scripts'))
          import sdk_codegen as compiler
          from probe_sdk_coverage import probes
          openapi = compiler.OpenApiIndex.load(ROOT / 'spec/openapi.yaml')
          rust = compiler.RustIndex.load(ROOT / 'src/generated')
          configured = json.loads((ROOT / 'codegen/sdk-semantics.json').read_text())
          configured, _ = compiler.expand_manifest(
              openapi, configured,
              json.loads((ROOT / 'codegen/sdk-taxonomy.json').read_text()),
              json.loads((ROOT / 'src/generated/coverage.json').read_text()),
          )
          modules, rejected = probes(openapi, rust, configured)
          report = {'generated_candidates': sorted(modules), 'rejected_candidates': rejected}
          digest = hashlib.sha256(json.dumps(report, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          baseline = {
              'schema_version': 1,
              'generated_candidates': len(modules),
              'rejected_candidates': len(rejected),
              'report_sha256': digest,
          }
          (ROOT / 'codegen/sdk-probe-baseline.json').write_text(json.dumps(baseline, indent=2) + '\n')
          print(json.dumps(baseline, indent=2))
          PY
      - name: Validate final tree
        run: bash scripts/validate.sh
      - name: Remove materialization bootstrap and commit generated tree
        run: |
          rm scripts/apply_binary_response.py .github/workflows/materialize-binary-response.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: project binary success responses'
          git push origin HEAD:feat/binary-success-responses

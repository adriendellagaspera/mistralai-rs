name: Bootstrap Fern production cutover

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: bootstrap-fern-production-cutover
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adriendellagaspera/rust-sdk-generator
          ref: 394d12ee893a256123545b75ba5e4a0f8f354ad7
          path: .tools/sdk-surface
          persist-credentials: false
      - name: Install pinned Fern and policy dependencies
        run: |
          npm install --global fern-api@5.112.0
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Materialize Fern production SDK
        run: |
          bash sdk-build/fern/generate.sh
          cargo generate-lockfile
      - name: Commit generated production tree to this cutover branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src Cargo.lock
          git add sdk-build/fern/inventory.json
          git add sdk-build/fern/compatibility-report.json
          git add sdk-build/fern/resolution.json
          git diff --cached --stat
          git commit -m 'feat(sdk): materialize Fern production SDK [fern-materialized]'
          git push origin "HEAD:${HEAD_REF}"

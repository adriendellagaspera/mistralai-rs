name: Build pinned official SDK parity audit

on:
  push:
    branches: [audit/pinned-sdk-parity]
    paths:
      - '.github/workflows/build-parity-audit.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pinned-official-sdk-parity
  cancel-in-progress: false

jobs:
  audit:
    name: Generate pinned official SDK evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate audit classification and report generation
        run: python3 -m unittest discover -s sdk-build -p 'test_*.py'
      - name: Extract pinned official SDK evidence
        run: |
          python3 sdk-build/official-sdks/audit.py update
          python3 sdk-build/official-sdks/audit.py check
      - name: Commit evidence to audit PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk-build/official-sdks/parity-audit.json sdk-build/official-sdks/PARITY_AUDIT.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes in pinned evidence."
            exit 0
          fi
          git commit -m 'docs(parity): pin official SDK HTTP and non-HTTP gap inventory'
          gh auth setup-git
          git push origin HEAD:refs/heads/audit/pinned-sdk-parity
          gh workflow run ci.yml --ref audit/pinned-sdk-parity

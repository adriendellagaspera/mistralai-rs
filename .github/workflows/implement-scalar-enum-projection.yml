name: Implement scalar enum projection
on:
  push:
    branches: [issue-19-scalar-enum-projection]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main
        run: |
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
      - name: Normalize schema patch helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_issue19_scalar_enum_patch.py')
          text = path.read_text()
          start = text.index('# Semantic overlay schema. Keep formatting localized.')
          end = text.index('# Automatic projection.')
          block = '''# Semantic overlay schema. Keep formatting localized.
          replace(
              "codegen/sdk-semantics.schema.json",
              '    "map": {"type": "object", "additionalProperties": false, "required": ["root", "path"], "properties": {\\n      "root": {"$ref": "#/$defs/identifier"}, "path": {"$ref": "#/$defs/schema_path"}\\n    }},',
              '    "map": {"type": "object", "additionalProperties": false, "required": ["root", "path"], "properties": {\\n      "root": {"$ref": "#/$defs/identifier"}, "path": {"$ref": "#/$defs/schema_path"}\\n    }},\\n    "scalar_enum": {"type": "object", "additionalProperties": false, "required": ["root", "path"], "properties": {\\n      "root": {"$ref": "#/$defs/identifier"}, "path": {"$ref": "#/$defs/schema_path"}\\n    }},',
          )
          replace(
              "codegen/sdk-semantics.schema.json",
              '"simple_union": {"$ref": "#/$defs/simple_union"}, "type_alias": {"const": true}, "map": {"$ref": "#/$defs/map"}, "union_factory"',
              '"simple_union": {"$ref": "#/$defs/simple_union"}, "type_alias": {"const": true}, "map": {"$ref": "#/$defs/map"}, "scalar_enum": {"$ref": "#/$defs/scalar_enum"}, "union_factory"',
          )
          schema_path = ROOT / "codegen/sdk-semantics.schema.json"
          lines = schema_path.read_text().splitlines()
          output = []
          inserted = False
          for line in lines:
              is_policy = line.startswith('      {"required": [') and '"not": {"anyOf": [' in line
              if is_policy:
                  line = line.replace(
                      '"not": {"anyOf": [',
                      '"not": {"anyOf": [{"required": ["scalar_enum"]}, ',
                      1,
                  )
              output.append(line)
              if line.startswith('      {"required": ["map"]'):
                  output.append(
                      '      {"required": ["scalar_enum"], "not": {"anyOf": '
                      '[{"required": ["union"]}, {"required": ["simple_union"]}, '
                      '{"required": ["type_alias"]}, {"required": ["map"]}, '
                      '{"required": ["constructor"]}, {"required": ["union_factory"]}, '
                      '{"required": ["accessors"]}]}},'
                  )
                  inserted = True
          if not inserted:
              raise SystemExit("scalar enum schema insertion point not found")
          schema_path.write_text("\\n".join(output) + "\\n")

          '''
          path.write_text(text[:start] + block + text[end:])
          PY
      - name: Apply generic scalar enum primitive
        run: python3 scripts/_issue19_scalar_enum_patch.py
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'codegen.lock') }}
      - name: Regenerate facade
        run: python3 scripts/codegen.py generate
      - name: Refresh reviewed probe baseline
        run: |
          PYTHON=$(find .tools -path '*/bin/python' | head -1)
          "$PYTHON" - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'codegen'))
          sys.path.insert(0, str(ROOT / 'scripts'))
          import sdk_codegen as compiler
          import probe_sdk_coverage as probe
          openapi = compiler.OpenApiIndex.load(ROOT / 'spec/openapi.yaml')
          rust = compiler.RustIndex.load(ROOT / 'src/generated')
          configured = json.loads((ROOT / 'codegen/sdk-semantics.json').read_text())
          configured, _ = compiler.expand_manifest(
              openapi, configured,
              json.loads((ROOT / 'codegen/sdk-taxonomy.json').read_text()),
              json.loads((ROOT / 'src/generated/coverage.json').read_text()), rust,
          )
          modules, rejected = probe.probes(openapi, rust, configured)
          report = {'generated_candidates': sorted(modules), 'rejected_candidates': rejected}
          digest = hashlib.sha256(json.dumps(report, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          baseline = {'schema_version': 1, 'generated_candidates': len(modules),
                      'rejected_candidates': len(rejected), 'report_sha256': digest}
          (ROOT / 'codegen/sdk-probe-baseline.json').write_text(json.dumps(baseline, indent=2) + '\n')
          print(json.dumps(baseline, sort_keys=True))
          PY
      - name: Validate complete repository
        run: bash scripts/validate.sh
      - name: Report automatic projection coverage
        run: |
          PYTHON=$(find .tools -path '*/bin/python' | head -1)
          "$PYTHON" - <<'PY'
          import json, sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'codegen'))
          import sdk_codegen as compiler
          openapi = compiler.OpenApiIndex.load(ROOT / 'spec/openapi.yaml')
          rust = compiler.RustIndex.load(ROOT / 'src/generated')
          manifest = json.loads((ROOT / 'codegen/sdk-semantics.json').read_text())
          taxonomy = json.loads((ROOT / 'codegen/sdk-taxonomy.json').read_text())
          raw = json.loads((ROOT / 'src/generated/coverage.json').read_text())
          _, report = compiler.expand_manifest(openapi, manifest, taxonomy, raw, rust)
          print(f"AUTO_COVERAGE={report['added_count']}/{report['rejected_count']}")
          print('REQUEST_MODEL_REJECTS=' + ','.join(
              op for op, reason in sorted(report['rejected'].items()) if reason == 'request_model_projection'
          ))
          PY
      - name: Commit clean increment
        run: |
          rm scripts/_issue19_scalar_enum_patch.py .github/workflows/implement-scalar-enum-projection.yml
          git add -A
          git commit -m 'feat: project scalar request enums generically'
          git push origin HEAD:issue-19-scalar-enum-projection

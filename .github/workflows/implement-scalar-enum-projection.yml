name: Implement scalar enum projection
on:
  push:
    branches: [issue-19-scalar-enum-projection]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main
        run: |
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
      - name: Apply generic scalar enum primitive
        run: python3 scripts/_issue19_scalar_enum_patch.py
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'codegen.lock') }}
      - name: Regenerate facade
        run: python3 scripts/codegen.py generate
      - name: Refresh reviewed probe baseline
        run: |
          PYTHON=$(find .tools -path '*/bin/python' | head -1)
          "$PYTHON" - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'codegen'))
          sys.path.insert(0, str(ROOT / 'scripts'))
          import sdk_codegen as compiler
          import probe_sdk_coverage as probe
          openapi = compiler.OpenApiIndex.load(ROOT / 'spec/openapi.yaml')
          rust = compiler.RustIndex.load(ROOT / 'src/generated')
          configured = json.loads((ROOT / 'codegen/sdk-semantics.json').read_text())
          configured, _ = compiler.expand_manifest(
              openapi, configured,
              json.loads((ROOT / 'codegen/sdk-taxonomy.json').read_text()),
              json.loads((ROOT / 'src/generated/coverage.json').read_text()), rust,
          )
          modules, rejected = probe.probes(openapi, rust, configured)
          report = {'generated_candidates': sorted(modules), 'rejected_candidates': rejected}
          digest = hashlib.sha256(json.dumps(report, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          baseline = {'schema_version': 1, 'generated_candidates': len(modules),
                      'rejected_candidates': len(rejected), 'report_sha256': digest}
          (ROOT / 'codegen/sdk-probe-baseline.json').write_text(json.dumps(baseline, indent=2) + '\n')
          print(json.dumps(baseline, sort_keys=True))
          PY
      - name: Validate complete repository
        run: bash scripts/validate.sh
      - name: Report automatic projection coverage
        run: |
          PYTHON=$(find .tools -path '*/bin/python' | head -1)
          "$PYTHON" - <<'PY'
          import json, sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'codegen'))
          import sdk_codegen as compiler
          openapi = compiler.OpenApiIndex.load(ROOT / 'spec/openapi.yaml')
          rust = compiler.RustIndex.load(ROOT / 'src/generated')
          manifest = json.loads((ROOT / 'codegen/sdk-semantics.json').read_text())
          taxonomy = json.loads((ROOT / 'codegen/sdk-taxonomy.json').read_text())
          raw = json.loads((ROOT / 'src/generated/coverage.json').read_text())
          _, report = compiler.expand_manifest(openapi, manifest, taxonomy, raw, rust)
          print(f"AUTO_COVERAGE={report['added_count']}/{report['rejected_count']}")
          print('REQUEST_MODEL_REJECTS=' + ','.join(
              op for op, reason in sorted(report['rejected'].items()) if reason == 'request_model_projection'
          ))
          PY
      - name: Commit clean increment
        run: |
          rm scripts/_issue19_scalar_enum_patch.py .github/workflows/implement-scalar-enum-projection.yml
          git add -A
          git commit -m 'feat: project scalar request enums generically'
          git push origin HEAD:issue-19-scalar-enum-projection

name: Materialize composed request validation
on:
  push:
    branches: [rust-sdk-compiler-composed-request-validation]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-sdk-compiler-composed-request-validation
          fetch-depth: 0
      - name: Apply normalized request validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          frontend = Path('src/rust_sdk_compiler/sdk_frontend.py')
          text = frontend.read_text()
          old = '                wire_schema = openapi.schema(raw)\n'
          new = '                wire_schema = openapi.object_schema(raw)\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected request schema validation occurrence count')
          text = text.replace(old, new, 1)
          old = '''                    wire_field = openapi.schema(model.raw).get("properties", {}).get(\n                        field, {}\n                    )\n'''
          new = '''                    wire_field = openapi.object_schema(model.raw).get("properties", {}).get(\n                        field, {}\n                    )\n'''
          if text.count(old) != 1:
              raise SystemExit('request override schema lookup not found')
          frontend.write_text(text.replace(old, new, 1))

          tests = Path('tests/test_standalone.py')
          text = tests.read_text()
          anchor = '    def test_library_exercises_transport_primitives(self):\n'
          insertion = '''    def test_composed_request_uses_effective_object_contract(self):\n        root = FIXTURES / "library"\n        document = json.loads((root / "openapi.json").read_text())\n        schemas = document["components"]["schemas"]\n        request = schemas["CreateBookRequest"]\n        schemas["CreateBookRequestBase"] = request\n        schemas["CreateBookRequest"] = {\n            "allOf": [\n                {"$ref": "#/components/schemas/CreateBookRequestBase"},\n                {\n                    "type": "object",\n                    "properties": {"pages": {"type": "integer"}},\n                },\n            ]\n        }\n        openapi = OpenApi(document)\n        policy = Policy.from_dict(json.loads((root / "policy.json").read_text()))\n        compilation = compile(openapi, load_bindings("library"), policy)\n        self.assertIn(\n            "pub async fn create(&self, request: NewBook)",\n            compilation.files["catalog_books.rs"],\n        )\n\n'''
          if anchor not in text:
              raise SystemExit('standalone test insertion point not found')
          tests.write_text(text.replace(anchor, insertion + anchor, 1))

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text()
          if 'version = "0.2.7"' not in text:
              raise SystemExit('unexpected pyproject version')
          pyproject.write_text(text.replace('version = "0.2.7"', 'version = "0.2.8"', 1))

          init = Path('src/rust_sdk_compiler/__init__.py')
          text = init.read_text()
          if '__version__ = "0.2.7"' not in text:
              raise SystemExit('unexpected package version')
          init.write_text(text.replace('__version__ = "0.2.7"', '__version__ = "0.2.8"', 1))
          PY
      - name: Validate standalone compiler
        run: |
          set -euo pipefail
          rm -rf /tmp/wheels /tmp/compiler-test
          mkdir -p /tmp/wheels
          python3 -m pip wheel -q --no-deps . -w /tmp/wheels
          python3 -m venv /tmp/compiler-test
          WHEEL=$(find /tmp/wheels -name 'rust_sdk_compiler-*.whl' | head -1)
          /tmp/compiler-test/bin/pip install -q "$WHEEL"
          /tmp/compiler-test/bin/pip install -q ruamel.yaml==0.18.6 jsonschema==4.23.0
          /tmp/compiler-test/bin/python -m unittest discover -s tests -v
      - name: Commit materialized compiler
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/materialize-composed-request-validation.yml
          git add src/rust_sdk_compiler/sdk_frontend.py src/rust_sdk_compiler/__init__.py pyproject.toml tests/test_standalone.py
          git commit -m 'fix: validate composed request object contracts'
          git push origin HEAD:rust-sdk-compiler-composed-request-validation
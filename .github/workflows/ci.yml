name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/policy.py
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/pr_title.py "$PR_TITLE"
      - name: Install actionlint 1.7.12
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 --connect-timeout 15 --max-time 60 -fsSLo /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.29.0
          persona: auditor
          online-audits: false
          advanced-security: false
          annotations: true

  generation:
    name: generation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: write # Dispatch CI after committing generator-produced SDK sources.
      contents: write # Commit Fern-generated sources on same-repository pull requests.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: rustup show
      - run: npm install --global fern-api@5.112.0 # zizmor: ignore[adhoc-packages]
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Materialize the reviewed SDK for same-repository pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: bash sdk-build/fern/generate.sh
      - name: Verify production generation
        run: bash sdk-build/fern/check.sh
      - name: Commit generated SDK and trigger verification on the new head
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src sdk-build/fern/inventory.json
          if git diff --cached --quiet; then
            echo "Generated SDK already matches the reviewed policy"
            exit 0
          fi
          git commit -m 'chore(sdk): regenerate Rust SDK from naming policy'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$HEAD_REF"
          gh workflow run ci.yml --ref "$HEAD_REF"

  generation-v1:
    name: generation-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: npm install --global fern-api@5.226.1 # zizmor: ignore[adhoc-packages]
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Generate and compile both Fern v1 parameter styles
        run: bash sdk-build/fern-v1/build.sh
      - name: Preserve generated SDKs and audit outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fern-v1-sdk-audit
          if-no-files-found: warn
          retention-days: 7
          path: |
            sdk-build/fern-v1/public-method-paths.tsv
            sdk-build/fern-v1/query-types-*.txt
            sdk-build/fern-v1/query-types.diff
            sdk-build/fern-v1/public-functions-*.txt
            sdk-build/fern-v1/public-functions.diff
            sdk-build/fern-v1/fern-generate-*.log
            sdk-build/fern-v1/cargo-check-*.log
            sdk-build/fern-v1/resolution.json
            sdk-build/fern-v1/fern/openapi.json

  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all --check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo clippy --locked --all-features -- -D clippy::correctness -D clippy::suspicious

  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny 0.20.2
        run: |
          mkdir -p /tmp/cargo-deny-install
          curl --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 --connect-timeout 15 --max-time 60 -fsSLo /tmp/cargo-deny.tar.gz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tar.gz' | sha256sum --check -
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp/cargo-deny-install
          find /tmp/cargo-deny-install -type f -name cargo-deny -perm -111 -print -quit > /tmp/cargo-deny-path
          test -s /tmp/cargo-deny-path
      - run: '"$(cat /tmp/cargo-deny-path)" check'

  tooling:
    name: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python3 -m unittest discover -s sdk-build -p 'test_*.py'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Verify pinned official SDK taxonomy and Tier-2/Tier-3 evidence
        run: python3 sdk-build/official-sdks/update.py check

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo check --locked --all-features
      - run: cargo test --locked --all-features --all-targets

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo doc --locked --all-features --no-deps
      - run: cargo publish --dry-run --locked

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 sdk-build/fern/api_check.py

  gate:
    name: gate
    if: always()
    needs: [policy, generation, generation-v1, format, lint, dependencies, tooling, test, docs, api]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs
        env:
          POLICY: ${{ needs.policy.result }}
          GENERATION: ${{ needs.generation.result }}
          GENERATION_V1: ${{ needs['generation-v1'].result }}
          FORMAT: ${{ needs.format.result }}
          LINT: ${{ needs.lint.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          TOOLING: ${{ needs.tooling.result }}
          TEST: ${{ needs.test.result }}
          DOCS: ${{ needs.docs.result }}
          API: ${{ needs.api.result }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Fork pull requests skip the write-enabled generation job; all other jobs remain required.
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            test "$GENERATION" = skipped
            GENERATION=success
          fi
          for result in "$POLICY" "$GENERATION" "$GENERATION_V1" "$FORMAT" "$LINT" "$DEPENDENCIES" "$TOOLING" "$TEST" "$DOCS" "$API"; do
            test "$result" = success
          done

name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bulk projection compiler prototype
        run: |
          git apply -p1 codegen/sdk_codegen.patch
          git apply -p1 scripts/test_sdk_facade.patch
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'codegen.lock') }}
      - name: Generate bulk semantic facade
        run: python3 scripts/codegen.py generate
      - name: Upload generated semantic facade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-generated-sdk
          path: src/sdk
      - name: Check generation, formatting, compilation, linting and tests
        run: bash scripts/validate.sh
      - name: Review generated public API changes
        if: github.event_name == 'pull_request'
        env:
          SDK_API_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_sdk_api.py --base "$SDK_API_BASE" --rustdoc

name: CI
on:
  push:
  pull_request:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'codegen.lock') }}
      - name: Bootstrap generated facade
        run: python scripts/codegen.py generate
      - name: Commit generated facade
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/sdk
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate Files SDK facade"
            git push
          fi
      - name: Check generation, formatting, compilation, linting and tests
        run: bash scripts/validate.sh
      - name: Review generated public API changes
        if: github.event_name == 'pull_request'
        env:
          SDK_API_BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_sdk_api.py --base "$SDK_API_BASE" --rustdoc

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/policy.py
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/pr_title.py "$PR_TITLE"
      - name: Install actionlint 1.7.12
        run: |
          curl -fsSLo /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.29.0
          persona: auditor
          online-audits: false
          advanced-security: false
          annotations: true

  generation:
    name: generation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adriendellagaspera/rust-sdk-generator
          ref: 394d12ee893a256123545b75ba5e4a0f8f354ad7
          path: .tools/sdk-surface
          persist-credentials: false
      - run: rustup show
      - run: npm install --global fern-api@5.112.0
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: bash sdk-build/fern/check.sh

  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all --check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo clippy --locked --all-features -- -D clippy::correctness -D clippy::suspicious

  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny 0.20.2
        run: |
          mkdir -p /tmp/cargo-deny-install
          curl -fsSLo /tmp/cargo-deny.tar.gz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tar.gz' | sha256sum --check -
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp/cargo-deny-install
          find /tmp/cargo-deny-install -type f -name cargo-deny -perm -111 -print -quit > /tmp/cargo-deny-path
          test -s /tmp/cargo-deny-path
      - run: '"$(cat /tmp/cargo-deny-path)" check'

  tooling:
    name: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s sdk-build -p 'test_*.py'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo check --locked --all-features
      - run: cargo test --locked --all-features --all-targets

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo doc --locked --all-features --no-deps
      - run: cargo publish --dry-run --locked

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 sdk-build/fern/api_check.py

  gate:
    name: gate
    if: always()
    needs: [policy, generation, format, lint, dependencies, tooling, test, docs, api]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs
        env:
          POLICY: ${{ needs.policy.result }}
          GENERATION: ${{ needs.generation.result }}
          FORMAT: ${{ needs.format.result }}
          LINT: ${{ needs.lint.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          TOOLING: ${{ needs.tooling.result }}
          TEST: ${{ needs.test.result }}
          DOCS: ${{ needs.docs.result }}
          API: ${{ needs.api.result }}
        run: |
          for result in "$POLICY" "$GENERATION" "$FORMAT" "$LINT" "$DEPENDENCIES" "$TOOLING" "$TEST" "$DOCS" "$API"; do
            test "$result" = success
          done

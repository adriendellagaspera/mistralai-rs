name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate agent and action-pin contracts
        run: python3 sdk-build/policy.py
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 sdk-build/pr_title.py "$PR_TITLE"
      - name: Install actionlint 1.7.12
        run: |
          curl -fsSLo /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.29.0
          persona: auditor
          online-audits: false
          advanced-security: false
          annotations: true

  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --all --check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets -- -D warnings

  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny 0.20.2
        run: |
          mkdir -p /tmp/cargo-deny-install
          curl -fsSLo /tmp/cargo-deny.tar.gz \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  /tmp/cargo-deny.tar.gz' | sha256sum --check -
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp/cargo-deny-install
          find /tmp/cargo-deny-install -type f -name cargo-deny -perm -111 -print -quit > /tmp/cargo-deny-path
          test -s /tmp/cargo-deny-path
      - name: Check advisories, licenses, bans and sources
        run: |
          binary="$(cat /tmp/cargo-deny-path)"
          "$binary" --version
          "$binary" check

  tooling:
    name: tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-python-${{ runner.os }}-${{ hashFiles('sdk-build/provenance.lock.json') }}
      - run: python3 -m unittest discover -s sdk-build -p 'test_*.py'

  generation:
    name: generation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools
            ~/.cargo/registry
            ~/.cargo/git
          key: tools-generation-${{ runner.os }}-${{ hashFiles('sdk-build/provenance.lock.json', 'Cargo.lock') }}
      - name: Verify deterministic generation and source inventories
        run: |
          python3 sdk-build/build.py check
          python3 sdk-build/official-sdks/update.py check

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --all-targets

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --doc
      - run: cargo doc --locked --no-deps

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: API review is pull-request scoped
        if: github.event_name != 'pull_request'
        run: echo 'No PR base to compare on push.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        if: github.event_name == 'pull_request'
        run: rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request'
        with:
          path: .tools
          key: tools-api-${{ runner.os }}-${{ hashFiles('sdk-build/provenance.lock.json') }}
      - name: Review generated public API changes
        if: github.event_name == 'pull_request'
        env:
          SDK_API_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 sdk-build/check_api_compatibility.py --base "$SDK_API_BASE" --rustdoc

  gate:
    name: gate
    if: always()
    needs: [policy, format, lint, dependencies, tooling, generation, test, docs, api]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI contract
        env:
          POLICY: ${{ needs.policy.result }}
          FORMAT: ${{ needs.format.result }}
          LINT: ${{ needs.lint.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          TOOLING: ${{ needs.tooling.result }}
          GENERATION: ${{ needs.generation.result }}
          TEST: ${{ needs.test.result }}
          DOCS: ${{ needs.docs.result }}
          API: ${{ needs.api.result }}
        run: |
          for result in "$POLICY" "$FORMAT" "$LINT" "$DEPENDENCIES" "$TOOLING" "$GENERATION" "$TEST" "$DOCS" "$API"; do
            test "$result" = success
          done

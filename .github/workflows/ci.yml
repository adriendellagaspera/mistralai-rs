name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install compiler core only
        run: python -m pip install .
      - name: Run backend-neutral compiler fixtures
        run: python -m unittest discover -s tests -p 'test_standalone.py'
      - name: Install openapi-to-rust adapter extra
        run: python -m pip install '.[openapi-to-rust]'
      - name: Run adapter contract tests
        run: python -m unittest discover -s tests -p 'test_openapi_to_rust_adapter.py'

name: CI
on:
  pull_request:
permissions:
  contents: write
jobs:
  restructure:
    if: github.head_ref == 'cleanup/sdk-only-no-codegen'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/sdk-only-no-codegen
          fetch-depth: 0
      - name: Run one-shot restructure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/restructure-tooling-bootstrap.yml').read_text()
          block = source.split('        run: |\n', 1)[1]
          Path('/tmp/restructure-tooling.sh').write_text(textwrap.dedent(block))
          PY
          bash /tmp/restructure-tooling.sh

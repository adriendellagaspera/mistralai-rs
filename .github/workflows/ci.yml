name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tooling/sources/lock.json') }}
      - name: Validate tracked sources, generation and Rust SDK
        run: bash tooling/quality/validate.sh
      - name: Review generated public API changes
        if: github.event_name == 'pull_request'
        env:
          SDK_API_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tooling/quality/api_surface.py --base "$SDK_API_BASE" --rustdoc

name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install compiler
        run: python -m pip install .
      - name: Run compiler fixtures
        run: python -m unittest discover -s tests -p 'test_*.py'

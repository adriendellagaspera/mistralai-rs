name: Implement scalar enum projection v2
on:
  push:
    branches: [issue-19-scalar-enum-projection-v2]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main
        run: |
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
      - name: Apply scalar enum primitive
        run: python3 scripts/_issue19_scalar_enum_v2.py
      - name: Enforce required-field drift guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('codegen/sdk_autoproject.py')
          text = path.read_text()
          old = '''    properties = schema.get("properties", {})
    if rust is None:
'''
          new = '''    properties = schema.get("properties", {})
    required = set(schema.get("required", []))
    if not required <= set(properties):
        return None, "request_model_projection"
    if rust is None:
'''
          if old not in text:
              raise SystemExit('required-field guard anchor missing')
          path.write_text(text.replace(old, new, 1))

          path = Path('scripts/test_sdk_autoproject.py')
          text = path.read_text()
          anchor = '    def test_projects_nested_request_objects_with_generated_adapters(self):\n'
          test = '''    def test_rejects_required_field_missing_from_wire_properties(self):
        api = FakeOpenApi()
        api.schemas["CreateThing"]["required"] = ["name", "missing"]
        fields = {
            "CreateThing": (
                SimpleNamespace(name="name", type="String"),
                SimpleNamespace(name="enabled", type="Option<bool>"),
            ),
        }
        rust = SimpleNamespace(
            structs=set(fields), aliases={}, enums={},
            symbol_modules={"CreateThing": "types"},
            fields=lambda name: fields[name],
        )
        expanded, report = sdk_autoproject.expand_manifest(
            api, manifest(),
            {"operations": {"create_thing": ["things.create"]}},
            raw_coverage("create_thing"), rust,
        )
        self.assertEqual("request_model_projection", report["rejected"]["create_thing"])
        self.assertNotIn("CreateThingParams", expanded["models"])

'''
          if anchor not in text:
              raise SystemExit('required-field test anchor missing')
          path.write_text(text.replace(anchor, test + anchor, 1))
          PY
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'codegen.lock') }}
      - name: Regenerate facade
        run: python3 scripts/codegen.py generate
      - name: Refresh probe baseline
        run: |
          PYTHON=$(find .tools -path '*/bin/python' | head -1)
          "$PYTHON" - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'codegen'))
          sys.path.insert(0, str(ROOT / 'scripts'))
          import sdk_compiler as compiler
          import probe_sdk_coverage as probe
          from sdk_autoproject import expand_manifest
          openapi = compiler.OpenApiIndex.load(ROOT / 'spec/openapi.yaml')
          raw = compiler.load_raw_ir(ROOT / 'src/generated')
          configured = json.loads((ROOT / 'codegen/sdk-semantics.json').read_text())
          configured, _ = expand_manifest(
              openapi, configured,
              json.loads((ROOT / 'codegen/sdk-taxonomy.json').read_text()),
              json.loads((ROOT / 'src/generated/coverage.json').read_text()), raw,
          )
          modules, rejected = probe.probes(openapi, raw, configured)
          report = {'generated_candidates': sorted(modules), 'rejected_candidates': rejected}
          digest = hashlib.sha256(json.dumps(report, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          baseline = {'schema_version': 1, 'generated_candidates': len(modules),
                      'rejected_candidates': len(rejected), 'report_sha256': digest}
          (ROOT / 'codegen/sdk-probe-baseline.json').write_text(json.dumps(baseline, indent=2) + '\n')
          print('PROBE_BASELINE=' + json.dumps(baseline, sort_keys=True))
          PY
      - name: Validate complete repository
        run: bash scripts/validate.sh
      - name: Report automatic projection coverage
        run: |
          PYTHON=$(find .tools -path '*/bin/python' | head -1)
          "$PYTHON" - <<'PY'
          import json, sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'codegen'))
          import sdk_compiler as compiler
          from sdk_autoproject import expand_manifest
          openapi = compiler.OpenApiIndex.load(ROOT / 'spec/openapi.yaml')
          raw = compiler.load_raw_ir(ROOT / 'src/generated')
          manifest = json.loads((ROOT / 'codegen/sdk-semantics.json').read_text())
          taxonomy = json.loads((ROOT / 'codegen/sdk-taxonomy.json').read_text())
          raw_coverage = json.loads((ROOT / 'src/generated/coverage.json').read_text())
          _, report = expand_manifest(openapi, manifest, taxonomy, raw_coverage, raw)
          print(f"AUTO_COVERAGE={report['added_count']}/{report['rejected_count']}")
          print('REQUEST_MODEL_REJECTS=' + ','.join(
              op for op, reason in sorted(report['rejected'].items())
              if reason == 'request_model_projection'
          ))
          PY
      - name: Commit clean increment
        run: |
          rm scripts/_issue19_scalar_enum_v2.py .github/workflows/implement-scalar-enum-v2.yml
          git add -A
          git commit -m 'feat: project scalar request enums generically'
          git push origin HEAD:issue-19-scalar-enum-projection-v2

name: Rebase issue 19 on current main
on:
  push:
    branches: [issue-19-complex-request-model-projection]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated issue 19 sources onto current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feat/complex-request-model-projection
          git checkout origin/feat/complex-request-model-projection -- \
            codegen/sdk-probe-baseline.json \
            codegen/sdk-semantics.schema.json \
            codegen/sdk_autoproject.py \
            scripts/probe_sdk_coverage.py \
            scripts/test_sdk_autoproject.py \
            scripts/test_sdk_facade.py
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "codegen/sdk_ir.py",
              '''@dataclass(frozen=True)\nclass RequestPolicy:\n''',
              '''@dataclass(frozen=True)\nclass TypeAliasPolicy:\n    pass\n\n\n@dataclass(frozen=True)\nclass RequestPolicy:\n''',
          )
          replace(
              "codegen/sdk_ir.py",
              '''ModelPolicy = UnionPolicy | SimpleUnionPolicy | RequestPolicy | ViewPolicy\n''',
              '''ModelPolicy = UnionPolicy | SimpleUnionPolicy | TypeAliasPolicy | RequestPolicy | ViewPolicy\n''',
          )
          replace(
              "codegen/sdk_ir.py",
              '''    if "accessors" in config:\n''',
              '''    if config.get("type_alias"):\n        return TypeAliasPolicy()\n    if "accessors" in config:\n''',
          )

          replace(
              "codegen/sdk_codegen.py",
              '''from sdk_ir import (Accessor, ModelPolicy, RequestPolicy, SimpleUnionPolicy, UnionPolicy, ViewPolicy,\n                    StreamPolicy, model_policy, stream_policy)\n''',
              '''from sdk_ir import (Accessor, ModelPolicy, RequestPolicy, SimpleUnionPolicy, TypeAliasPolicy,\n                    UnionPolicy, ViewPolicy, StreamPolicy, model_policy, stream_policy)\n''',
          )
          replace(
              "codegen/sdk_codegen.py",
              '''def _emit_model(model: ModelSpec, openapi: OpenApiIndex, rust: RustIndex) -> str:\n''',
              '''def _public_alias_type(syntax: RustType, rust: RustIndex, seen: tuple[str, ...] = ()) -> str:\n    if syntax.spelling in rust.aliases:\n        if syntax.spelling in seen:\n            raise GenerationError(f"recursive raw type alias: {syntax.spelling}")\n        return _public_alias_type(rust.aliases[syntax.spelling], rust, (*seen, syntax.spelling))\n    if syntax.spelling in rust.symbol_modules:\n        raise GenerationError(f"public type alias references generated symbol: {syntax.spelling}")\n    if syntax.kind == "generic_type":\n        return f"{syntax.constructor}<{', '.join(_public_alias_type(argument, rust, seen) for argument in syntax.arguments)}>"\n    return syntax.spelling\n\n\ndef _emit_type_alias(model: ModelSpec, rust: RustIndex) -> str:\n    assert isinstance(model.config, TypeAliasPolicy)\n    return f"pub type {model.name} = {_public_alias_type(rust.aliases[model.raw], rust, (model.raw,))};"\n\n\ndef _emit_model(model: ModelSpec, openapi: OpenApiIndex, rust: RustIndex) -> str:\n''',
          )
          replace(
              "codegen/sdk_codegen.py",
              '''    if isinstance(model.config, SimpleUnionPolicy):\n        return _emit_simple_union(model, rust)\n    if isinstance(model.config, ViewPolicy):\n''',
              '''    if isinstance(model.config, SimpleUnionPolicy):\n        return _emit_simple_union(model, rust)\n    if isinstance(model.config, TypeAliasPolicy):\n        return _emit_type_alias(model, rust)\n    if isinstance(model.config, ViewPolicy):\n''',
          )
          replace(
              "codegen/sdk_codegen.py",
              '''        manifest, projection_report = expand_manifest(openapi, manifest, taxonomy, raw_coverage)\n''',
              '''        manifest, projection_report = expand_manifest(openapi, manifest, taxonomy, raw_coverage, rust)\n''',
          )
          PY
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'codegen.lock') }}
      - name: Regenerate and validate on current main
        run: |
          python3 scripts/codegen.py generate
          bash scripts/validate.sh
      - name: Remove integration scaffolding and push
        run: |
          rm -f .github/workflows/rebase-issue-19.yml
          git add -A
          git commit -m 'feat: project complex request models generically'
          git push origin HEAD:issue-19-complex-request-model-projection

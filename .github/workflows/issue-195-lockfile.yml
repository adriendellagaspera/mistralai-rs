name: Issue 195 temporary lockfile refresh

on:
  push:
    branches: [fix/195-rustsec-lockfile]
    paths: [.github/workflows/issue-195-lockfile.yml]

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # Commit the lockfile resolved by Cargo (temporary workflow).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - name: Resolve only the audited vulnerable or yanked dependencies
        run: |
          cargo update -p rustls@0.23.45 --precise 0.23.46
          cargo update -p rustls-webpki@0.103.15 --precise 0.103.16
          cargo update -p tokio@1.53.1 --precise 1.53.3
          cargo update -p webpki-roots@1.0.9 --precise 1.0.11
          cargo update -p yoke-derive@0.8.3 --precise 0.8.4
          cargo metadata --locked --format-version 1 >/dev/null
          git diff --check
          git diff --stat
      - name: Commit Cargo.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo 'No lockfile changes were produced'
            exit 1
          fi
          git commit -m 'fix(deps): refresh lockfile for current RustSec advisories (#195)'
          gh auth setup-git
          git push origin HEAD:refs/heads/fix/195-rustsec-lockfile

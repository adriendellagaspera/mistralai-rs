name: Check crates.io package names

on:
  push:
    branches:
      - chore/crates-release
    paths:
      - .github/workflows/check-crate-names.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe candidate crate names
        shell: bash
        run: |
          set -euo pipefail
          for name in mistralai-sdk mistral-ai-sdk mistral-rs mistral-sdk-rs; do
            code="$(curl --silent --show-error --user-agent "mistralai-rs-name-check/1.0 (https://github.com/adriendellagaspera/mistralai-rs)" --output "/tmp/$name.json" --write-out "%{http_code}" "https://crates.io/api/v1/crates/$name")"
            printf '%s %s\n' "$name" "$code"
            if [ "$code" = "200" ]; then
              jq -r '"  existing max_version=" + (.crate.max_version // "?") + " repository=" + (.crate.repository // "?")' "/tmp/$name.json"
            elif [ "$code" != "404" ]; then
              cat "/tmp/$name.json"
              exit 1
            fi
          done

name: Check crates.io package names

on:
  push:
    branches:
      - chore/crates-release
    paths:
      - .github/workflows/check-crate-names.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe candidate crate names
        shell: bash
        run: |
          set -euo pipefail
          for name in mistralai-sdk mistral-ai-sdk mistral-rs mistral-sdk-rs; do
            code="$(curl --silent --show-error --output "/tmp/$name.json" --write-out "%{http_code}" "https://crates.io/api/v1/crates/$name")"
            printf '%s %s\n' "$name" "$code"
            if [ "$code" = "200" ]; then
              python3 - "$name" < "/tmp/$name.json" <<'PY'
import json
import sys
name = sys.argv[1]
data = json.load(sys.stdin)
crate = data["crate"]
print(f"  existing max_version={crate.get('max_version')} downloads={crate.get('downloads')} repository={crate.get('repository')}")
PY
            elif [ "$code" != "404" ]; then
              cat "/tmp/$name.json"
              exit 1
            fi
          done

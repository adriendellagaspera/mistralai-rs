name: Regenerate typed IPA SDK after #197
on:
  push:
    branches: [fix/remove-197-workarounds]
    paths: ['.github/workflows/regen-197.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: fix-remove-197-regenerate
  cancel-in-progress: true
jobs:
  regenerate:
    name: Validate and commit fully typed IPA model
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: npm install --global fern-api@5.112.0 # zizmor: ignore[adhoc-packages]
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Regression tests
        run: python3 -m unittest discover -s sdk-build -p 'test_*.py'
      - name: Regenerate canonical Rust SDK
        run: bash sdk-build/fern/generate.sh
      # Re-run after formatting the committed protocol regression tests.
      - name: Validate typed output
        run: |
          echo "Generated IPAPhoneme:"
          cat src/api/types/ipa_phoneme.rs
          cargo generate-lockfile
          cargo fmt --all --check
          cargo check --locked --all-features
          cargo clippy --locked --all-features -- -D clippy::correctness -D clippy::suspicious
          cargo test --locked --all-features --all-targets
          cargo publish --dry-run --locked --allow-dirty
      - name: Commit generated SDK to candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src
          git add -u sdk-build/fern Cargo.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated SDK changes to commit"
            exit 0
          fi
          git commit -m 'fix(fern): generate exhaustively typed IPA phonemes without String fallback'
          gh auth setup-git
          git fetch origin refs/heads/fix/remove-197-workarounds
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/fix/remove-197-workarounds
          gh workflow run ci.yml --ref fix/remove-197-workarounds

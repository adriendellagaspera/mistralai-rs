name: Regenerate private Rust lockfile for review
on:
  push:
    branches: [refactor/python-free-sdk-build]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve dependency graph and emit lockfile for review
        run: |
          rustup show
          cargo generate-lockfile --manifest-path sdk-build/Cargo.toml
          echo SDK_BUILD_LOCK_BEGIN
          base64 -w0 sdk-build/Cargo.lock
          echo
          echo SDK_BUILD_LOCK_END

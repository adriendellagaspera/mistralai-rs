name: Fern Mistral 288 spike

on:
  pull_request:
    paths:
      - ".github/workflows/fern-spike.yml"
      - "sdk-build/fern-spike/**"
      - "sdk-build/openapi/published.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fern-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install pinned Fern CLI
        run: npm install --global fern-api@5.112.0

      - name: Prepare Fern-compatible Mistral 288 source
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python sdk-build/fern-spike/prepare_fern_input.py \
            sdk-build/openapi/published.yaml \
            sdk-build/fern-spike/fern/openapi.yaml

      - name: Diagnose Fern IR paths
        working-directory: sdk-build/fern-spike
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          fern ir diagnostics/normal-ir.json --language rust --disable-examples             > diagnostics/normal-ir.log 2>&1
          echo $? > diagnostics/normal-ir.exit
          fern ir diagnostics/direct-openapi-ir.json --language rust --disable-examples --from-openapi             > diagnostics/direct-openapi-ir.log 2>&1
          echo $? > diagnostics/direct-openapi-ir.exit
          echo "normal IR exit: $(cat diagnostics/normal-ir.exit)"
          echo "direct OpenAPI IR exit: $(cat diagnostics/direct-openapi-ir.exit)"
          for file in diagnostics/*-ir.json; do
            [[ -f "$file" ]] || continue
            python - "$file" <<'PY'
          import json, sys
          p = sys.argv[1]
          data = json.load(open(p))
          needles = ("judgeChatCompletionEvent", "judgeConversation", "judgeDatasetRecord", "JudgeOutput")
          def walk(x, path=()):
              if isinstance(x, dict):
                  blob = json.dumps(x, separators=(",", ":"))
                  if any(n in blob for n in needles):
                      print("/".join(map(str, path)), json.dumps(x)[:12000])
                  for k, v in x.items():
                      walk(v, path + (k,))
              elif isinstance(x, list):
                  for i, v in enumerate(x):
                      walk(v, path + (i,))
          walk(data)
          PY
          done

      - name: Generate Rust SDK with Fern 0.48.0
        working-directory: sdk-build/fern-spike
        run: fern generate --group rust-sdk --local --no-prompt --force --log-level info

      - name: Generate product-shaped Fern variant
        run: |
          python sdk-build/fern-spike/prepare_fern_product_input.py \
            sdk-build/fern-spike/fern/openapi.yaml \
            sdk-build/fern-spike/product/fern/openapi.yaml
          (
            cd sdk-build/fern-spike/product
            fern generate --group rust-sdk --local --no-prompt --force --log-level info
          )

      - name: Compare product-shaped Fern surface
        run: |
          python sdk-build/fern-spike/compare_surfaces.py \
            sdk-build/fern-spike/product/generated-product \
            sdk-build/fern-spike/fern-product-surface-comparison.json
          echo "## Product-shaped Fern proof" >> "$GITHUB_STEP_SUMMARY"
          for needle in 'pub async fn complete' 'pub async fn complete_stream' 'pub async fn create' 'pub async fn process' 'pub async fn list' 'pub async fn download'; do
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "`$needle`" >> "$GITHUB_STEP_SUMMARY"
            grep -R -n -m 8 "$needle" sdk-build/fern-spike/product/generated-product/src               | sed 's#^#- #' >> "$GITHUB_STEP_SUMMARY" || true
          done

      - name: Compare current and Fern public surfaces
        run: |
          python sdk-build/fern-spike/compare_surfaces.py \
            sdk-build/fern-spike/generated \
            sdk-build/fern-spike/fern-surface-comparison.json

      - name: Prepare patched validation copy
        run: |
          rm -rf sdk-build/fern-spike/generated-patched
          cp -R sdk-build/fern-spike/generated sdk-build/fern-spike/generated-patched
          python sdk-build/fern-spike/patch_fern_output.py sdk-build/fern-spike/generated-patched

      - name: Record source and generated-surface metrics
        run: |
          python sdk-build/fern-spike/analyze.py \
            sdk-build/openapi/published.yaml \
            sdk-build/fern-spike/generated

      - name: Prepare standalone generated crate
        id: crate
        shell: bash
        run: |
          manifest="$(find sdk-build/fern-spike/generated-patched -name Cargo.toml -print -quit)"
          if [[ -z "$manifest" ]]; then
            echo "No generated Cargo.toml found" >&2
            exit 1
          fi
          standalone="$RUNNER_TEMP/fern-generated"
          rm -rf "$standalone"
          cp -R "$(dirname "$manifest")" "$standalone"
          echo "manifest=$standalone/Cargo.toml" >> "$GITHUB_OUTPUT"
          echo "Standalone generated manifest: $standalone/Cargo.toml"

      - name: cargo fmt --check
        run: cargo fmt --manifest-path "${{ steps.crate.outputs.manifest }}" -- --check

      - name: cargo check
        run: cargo check --manifest-path "${{ steps.crate.outputs.manifest }}" --all-features

      - name: Record Fern clippy warnings
        shell: bash
        run: |
          set +e
          cargo clippy --manifest-path "${{ steps.crate.outputs.manifest }}" --all-features --message-format short             2>&1 | tee sdk-build/fern-spike/fern-clippy.log
          status=${PIPESTATUS[0]}
          warning_count="$(grep -c 'warning:' sdk-build/fern-spike/fern-clippy.log || true)"
          echo "Fern clippy warnings: $warning_count"
          echo "- Clippy warnings: $warning_count" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: cargo clippy correctness and suspicious
        run: |
          cargo clippy --manifest-path "${{ steps.crate.outputs.manifest }}" --all-features --             -D clippy::correctness -D clippy::suspicious

      - name: Summarize generated tree
        if: always()
        shell: bash
        run: |
          echo "## Fern Mistral 288 spike" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fern CLI: 5.112.0" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rust generator: 0.48.0" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f sdk-build/fern-spike/fern-spike-report.json ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`json' >> "$GITHUB_STEP_SUMMARY"
            cat sdk-build/fern-spike/fern-spike-report.json | jq 'del(.operations)' >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          fi
          find sdk-build/fern-spike/generated -maxdepth 3 -type f 2>/dev/null | sort | head -200 || true

      - name: Upload raw Fern output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fern-mistral-288
          if-no-files-found: warn
          path: |
            sdk-build/fern-spike/generated
            sdk-build/fern-spike/generated-patched
            sdk-build/fern-spike/fern-spike-report.json
            sdk-build/fern-spike/fern-surface-comparison.json
            sdk-build/fern-spike/fern-product-surface-comparison.json
            sdk-build/fern-spike/product/generated-product
            sdk-build/fern-spike/fern-clippy.log
            sdk-build/fern-spike/diagnostics

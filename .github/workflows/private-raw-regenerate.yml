name: Regenerate Private Raw Boundary

on:
  push:
    branches: [feat/private-raw-boundary]

permissions:
  contents: write

concurrency:
  group: private-raw-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools
            ~/.cargo/registry
            ~/.cargo/git
            sdk-build/target
          key: private-raw-${{ runner.os }}-${{ hashFiles('sdk-build/provenance.lock.json', 'sdk-build/Cargo.lock') }}
          restore-keys: |
            private-raw-${{ runner.os }}-
            tools-generation-${{ runner.os }}-
      - name: Regenerate and verify canonical SDK
        run: |
          cargo run --quiet --locked --manifest-path sdk-build/Cargo.toml -- generate
          cargo run --quiet --locked --manifest-path sdk-build/Cargo.toml -- check
          cargo fmt --all --check
      - name: Commit generated facade and remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/private-raw-regenerate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/generated src/sdk .github/workflows/private-raw-regenerate.yml
          if git diff --cached --quiet; then
            echo 'Expected generated facade changes were not produced.' >&2
            exit 1
          fi
          git commit -m 'chore: regenerate SDK with merged private transport generator'
          gh auth setup-git
          git push origin HEAD:feat/private-raw-boundary

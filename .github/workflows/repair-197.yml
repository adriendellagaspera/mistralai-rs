name: Repair and validate Mistral upstream candidate
on:
  push:
    branches: [automation/update-mistral-sources]
    paths: ['.github/workflows/repair-197.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: repair-mistral-197
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # Commit the validated generated Rust SDK to the PR.
      actions: write # Explicitly trigger CI for GITHUB_TOKEN-created commit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: npm install --global fern-api@5.112.0 # zizmor: ignore[adhoc-packages]
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Check Python regression suite
        run: python3 -m unittest discover -s sdk-build -p 'test_*.py'
      - name: Rebuild published SDK
        run: |
          python3 sdk-build/official-sdks/update.py update
          bash sdk-build/fern/generate.sh
      - name: Validate candidate
        run: |
          cargo generate-lockfile
          bash sdk-build/fern/check.sh
          python3 sdk-build/official-sdks/update.py check
          cargo fmt --all --check
          cargo check --locked --all-features
          cargo clippy --locked --all-features -- -D clippy::correctness -D clippy::suspicious
          cargo test --locked --all-features --all-targets
          cargo publish --dry-run --locked
      - name: Commit regenerated Rust SDK and inventories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src sdk-build/fern sdk-build/official-sdks Cargo.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Generated output was already current."
            exit 0
          fi
          git commit -m 'fix: regenerate Rust SDK for published Mistral OpenAPI'
          gh auth setup-git
          git push origin HEAD:refs/heads/automation/update-mistral-sources
          gh workflow run ci.yml --ref automation/update-mistral-sources

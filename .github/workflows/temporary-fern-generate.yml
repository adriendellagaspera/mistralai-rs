name: Temporary Fern generation

on:
  push:
    branches:
      - chore/explicit-sdk-operation-names

permissions:
  contents: write
  actions: write

concurrency:
  group: temporary-fern-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Install pinned Fern CLI
        run: npm install --global fern-api@5.112.0

      - name: Install pinned Python dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Generate SDK sources
        run: bash sdk-build/fern/generate.sh

      - name: Verify generated SDK is reproducible
        run: bash sdk-build/fern/check.sh

      - name: Commit generated sources
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src sdk-build/fern/inventory.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(fern): regenerate SDK for explicit operation names"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch repository CI on generated commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref_name }}
        run: |
          gh api --method POST "repos/$GH_REPO/actions/workflows/ci.yml/dispatches" -f ref="$GH_REF"

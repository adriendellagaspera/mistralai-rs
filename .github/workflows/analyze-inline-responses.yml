name: Analyze inline response shapes
on:
  push:
    branches: [feat/inline-response-projection]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler Python dependencies
        run: python -m pip install 'ruamel.yaml==0.18.6' 'tree-sitter==0.25.2' 'tree-sitter-rust==0.24.0' 'jsonschema==4.23.0'
      - name: Print unresolved response contracts
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'codegen')
          import sdk_codegen as c
          root=Path('.')
          api=c.OpenApiIndex.load(root/'spec/openapi.yaml')
          rust=c.RustIndex.load(root/'src/generated')
          coverage=json.loads((root/'src/generated/coverage.json').read_text())
          raw={x['operation_id']:x['rust_method'] for x in coverage['operations'] if x.get('upstream',True)}
          ids=[
            'agents_api_v1_agents_list',
            'agents_api_v1_agents_list_version_aliases',
            'agents_api_v1_agents_list_versions',
            'agents_api_v1_conversations_get',
            'agents_api_v1_conversations_list',
            'connector_get_authentication_methods_v1',
            'connector_list_tools_v1',
            'execute_workflow_registration_v1_workflows_registrations__workflow_registration_id__execute_post',
            'execute_workflow_v1_workflows__workflow_identifier__execute_post',
            'get_run_history_v1_workflows_runs__run_id__history_get',
            'get_workflow_execution_history_v1_workflows_executions__execution_id__history_get',
            'libraries_documents_get_extracted_text_signed_url_v1',
            'libraries_documents_get_signed_url_v1',
          ]
          for oid in ids:
            op=api.operation(oid)
            schema=c._success_schema(op)
            method=raw.get(oid)
            success=rust.operation(method).success_type if method else None
            print('===',oid)
            print('raw_method:',method)
            print('raw_success:',success)
            print('schema:',json.dumps(schema,sort_keys=True))
          PY

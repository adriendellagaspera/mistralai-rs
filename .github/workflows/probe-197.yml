name: Diagnose Fern #197 workarounds
on:
  push:
    branches: [fix/remove-197-workarounds]
    paths: ['.github/workflows/probe-197.yml']
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        fern_version: ['5.112.0', '5.190.0', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Install Fern CLI
        run: |
          npm view fern-api version
          npm install --global fern-api@${{ matrix.fern_version }} # zizmor: ignore[adhoc-packages]
          fern --version
      - name: Generate known-compatible Fern input
        run: |
          python3 sdk-build/fern/prepare_fern_source.py sdk-build/openapi/published.yaml sdk-build/fern/compatible.yaml sdk-build/fern/compatibility-report.json
      - name: Probe each original contract independently
        run: python3 sdk-build/fern/diagnose_197.py

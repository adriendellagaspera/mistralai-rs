name: Publish crate

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      already-published: ${{ steps.registry.outputs.already-published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Validate tag and package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          expected="v$version"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check crates.io state
        id: registry
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error \
            --user-agent "mistralai-rs-release/1.0 (https://github.com/adriendellagaspera/mistralai-rs)" \
            --output /tmp/crate.json \
            --write-out "%{http_code}" \
            "https://crates.io/api/v1/crates/mistralai-sdk")"

          if [ "$code" = "404" ]; then
            echo "mistralai-sdk does not exist on crates.io yet." >&2
            echo "Trusted Publishing cannot create a new crate; bootstrap the first version manually." >&2
            exit 1
          fi
          if [ "$code" != "200" ]; then
            cat /tmp/crate.json >&2
            exit 1
          fi

          if jq -e --arg version "$VERSION" '.versions[] | select(.num == $version)' /tmp/crate.json >/dev/null; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "mistralai-sdk $VERSION is already published; skipping registry upload."
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify publishable package
        if: steps.registry.outputs.already-published != 'true'
        run: cargo publish --dry-run --locked

  publish:
    name: publish
    needs: preflight
    if: needs.preflight.outputs.already-published != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Mint the short-lived crates.io Trusted Publishing credential.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish mistralai-sdk
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    name: github-release
    needs: [preflight, publish]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create the GitHub Release for the already-pushed release tag.
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

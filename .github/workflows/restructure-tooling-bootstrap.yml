name: Restructure tooling sidecar
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  restructure:
    if: github.head_ref == 'cleanup/sdk-only-no-codegen'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/sdk-only-no-codegen
          fetch-depth: 0
      - name: Restructure repository tooling
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          mkdir -p tooling/sources/openapi tooling/pipeline/mistral tooling/quality tooling/tests tooling/licenses

          git mv codegen.lock tooling/sources/lock.json
          git mv spec/openapi.yaml tooling/sources/openapi/openapi.yaml
          git mv spec/LICENSE tooling/sources/openapi/LICENSE
          if [ -f spec/NOTICE ]; then git mv spec/NOTICE tooling/sources/openapi/NOTICE; fi
          rmdir spec

          git mv codegen/openapi-to-rust.toml tooling/pipeline/openapi-to-rust.toml
          git mv codegen/patches/generator.patch tooling/pipeline/openapi-to-rust.patch
          git mv codegen/preprocess.py tooling/pipeline/preprocess.py
          git mv codegen/sdk-semantics.json tooling/pipeline/semantics.json
          git mv codegen/sdk_facade.py tooling/pipeline/compile_sdk.py
          git mv codegen/mistral/rust_types.py tooling/pipeline/mistral/rust_types.py
          git mv codegen/mistral/sdk_autoproject.py tooling/pipeline/mistral/sdk_autoproject.py
          git mv codegen/mistral/sdk_contracts.py tooling/pipeline/mistral/sdk_contracts.py
          git mv codegen/mistral/sdk_pipeline.py tooling/pipeline/mistral/sdk_pipeline.py
          git mv codegen/coverage.py tooling/quality/coverage.py
          git mv codegen/sdk-probe-baseline.json tooling/quality/probe-baseline.json
          git mv codegen/sdk-taxonomy.json tooling/sources/taxonomy.json
          git mv codegen/GENERATOR-LICENSE tooling/licenses/openapi-to-rust-MIT.txt
          git rm codegen/README.md
          rmdir codegen/patches codegen/mistral codegen

          git mv scripts/update_spec.py tooling/sources/openapi.py
          git mv scripts/sdk_taxonomy.py tooling/sources/taxonomy.py
          git mv scripts/sdk_taxonomy_inventory.py tooling/sources/taxonomy_inventory.py
          git mv scripts/codegen.py tooling/pipeline/build.py
          git mv scripts/probe_sdk_coverage.py tooling/quality/probe.py
          git mv scripts/check_sdk_api.py tooling/quality/api_surface.py
          git mv scripts/update_report.py tooling/quality/report.py
          git mv scripts/validate.sh tooling/quality/validate.sh
          git mv scripts/run_codegen_tests.py tooling/tests/run.py
          rmdir scripts

          git mv codegen_tests/test_codegen.py tooling/tests/test_pipeline.py
          git mv codegen_tests/test_coverage.py tooling/tests/test_coverage.py
          git mv codegen_tests/test_sdk_autoproject.py tooling/tests/test_sdk_autoproject.py
          git mv codegen_tests/test_sdk_contracts.py tooling/tests/test_sdk_contracts.py
          git mv codegen_tests/test_sdk_taxonomy.py tooling/tests/test_sdk_taxonomy.py
          rmdir codegen_tests

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          def replace(path, replacements):
              p = root / path
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing replacement in {path}: {old!r}')
                  text = text.replace(old, new)
              p.write_text(text)

          lock_path = root / 'tooling/sources/lock.json'
          lock = json.loads(lock_path.read_text())
          lock['generator_config'] = 'tooling/pipeline/openapi-to-rust.toml'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          replace('tooling/pipeline/openapi-to-rust.toml', [
              ('spec_path = "../spec/openapi.codegen.yaml"', 'spec_path = "../sources/openapi/openapi.codegen.yaml"'),
              ('output_dir = "../src/generated"', 'output_dir = "../../src/generated"'),
          ])

          replace('tooling/pipeline/build.py', [
              ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parents[2]'),
              ('sys.path.insert(0, str(ROOT / "codegen"))', 'sys.path.insert(0, str(ROOT / "tooling" / "pipeline"))'),
              ('GENERATED_MARKER = b"// @generated by codegen/sdk_facade.py; do not edit by hand.\\n"', 'GENERATED_MARKER = b"// @generated by tooling/pipeline/compile_sdk.py; do not edit by hand.\\n"'),
              ('ROOT / "codegen/patches/generator.patch"', 'ROOT / "tooling/pipeline/openapi-to-rust.patch"'),
              ('f"python-sdk-codegen-{versions}"', 'f"python-sdk-tooling-{versions}"'),
              ('choices=["generate", "check", "probe"]', 'choices=["generate", "check", "probe", "raw"]'),
              ('ROOT / "codegen.lock"', 'ROOT / "tooling/sources/lock.json"'),
              ('ROOT / "spec/openapi.yaml"', 'ROOT / "tooling/sources/openapi/openapi.yaml"'),
              ('ROOT / "scripts/run_codegen_tests.py"', 'ROOT / "tooling/tests/run.py"'),
              ('prefix=".codegen-"', 'prefix=".tooling-build-"'),
              ('shutil.copytree(ROOT / "spec", work / "spec")\n        shutil.copytree(ROOT / "codegen", work / "codegen")', 'shutil.copytree(ROOT / "tooling" / "sources" / "openapi", work / "tooling" / "sources" / "openapi")\n        shutil.copytree(ROOT / "tooling" / "pipeline", work / "tooling" / "pipeline")'),
              ('work / "codegen/preprocess.py",\n            work / "spec/openapi.yaml", work / "spec/openapi.codegen.yaml"', 'work / "tooling/pipeline/preprocess.py",\n            work / "tooling/sources/openapi/openapi.yaml", work / "tooling/sources/openapi/openapi.codegen.yaml"'),
              ('ROOT / "codegen/coverage.py", work / "spec/openapi.yaml",\n            work / "spec/openapi.codegen.yaml", generated', 'ROOT / "tooling/quality/coverage.py", work / "tooling/sources/openapi/openapi.yaml",\n            work / "tooling/sources/openapi/openapi.codegen.yaml", generated'),
              ('work / "codegen/sdk_facade.py", generated, facade,\n            "--manifest", work / "codegen/sdk-semantics.json",\n            "--openapi", work / "spec/openapi.yaml"', 'work / "tooling/pipeline/compile_sdk.py", generated, facade,\n            "--manifest", work / "tooling/pipeline/semantics.json",\n            "--openapi", work / "tooling/sources/openapi/openapi.yaml",\n            "--taxonomy", ROOT / "tooling/sources/taxonomy.json"'),
          ])

          build = (root / 'tooling/pipeline/build.py').read_text()
          marker = '        for path in sorted(generated.rglob("*.rs")):\n            run("rustup", "run", lock["rust_toolchain"], "rustfmt",\n                "--edition", "2024", "--config", "skip_children=true", path)\n        facade = work / "src/sdk"\n'
          replacement = '        for path in sorted(generated.rglob("*.rs")):\n            run("rustup", "run", lock["rust_toolchain"], "rustfmt",\n                "--edition", "2024", "--config", "skip_children=true", path)\n        if args.command == "raw":\n            target = ROOT / "src/generated"\n            if target.exists():\n                shutil.rmtree(target)\n            shutil.copytree(generated, target)\n            print("Generated raw bindings from verified, pinned OpenAPI source.")\n            return\n        facade = work / "src/sdk"\n'
          if marker not in build:
              raise SystemExit('raw-stage insertion point not found')
          (root / 'tooling/pipeline/build.py').write_text(build.replace(marker, replacement))

          replace('tooling/pipeline/mistral/sdk_pipeline.py', [
              ('// @generated by codegen/sdk_facade.py; do not edit by hand.', '// @generated by tooling/pipeline/compile_sdk.py; do not edit by hand.'),
              ('manifest_path.parent.parent / "spec" / "openapi.yaml"', 'manifest_path.parent.parent / "sources" / "openapi" / "openapi.yaml"'),
              ('candidate = manifest_path.with_name("sdk-taxonomy.json")', 'candidate = manifest_path.parent.parent / "sources" / "taxonomy.json"'),
          ])

          replace('tooling/sources/openapi.py', [
              ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parents[2]'),
              ('ROOT / "codegen.lock"', 'ROOT / "tooling/sources/lock.json"'),
              ('ROOT / "spec/openapi.yaml"', 'ROOT / "tooling/sources/openapi/openapi.yaml"'),
              ('ROOT / "spec/LICENSE"', 'ROOT / "tooling/sources/openapi/LICENSE"'),
              ('ROOT / "spec/NOTICE"', 'ROOT / "tooling/sources/openapi/NOTICE"'),
          ])

          replace('tooling/sources/taxonomy.py', [
              ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parents[2]'),
              ('LOCK_PATH = ROOT / "codegen.lock"', 'LOCK_PATH = ROOT / "tooling/sources/lock.json"'),
              ('OUTPUT_PATH = ROOT / "codegen/sdk-taxonomy.json"', 'OUTPUT_PATH = ROOT / "tooling/sources/taxonomy.json"'),
              ('Missing codegen lock keys', 'Missing source lock keys'),
          ])

          replace('tooling/sources/taxonomy_inventory.py', [
              ('import sdk_taxonomy', 'import taxonomy as sdk_taxonomy'),
              ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parents[2]'),
              ('LOCK_PATH = ROOT / "codegen.lock"', 'LOCK_PATH = ROOT / "tooling/sources/lock.json"'),
              ('OUTPUT_PATH = ROOT / "codegen/sdk-taxonomy.json"', 'OUTPUT_PATH = ROOT / "tooling/sources/taxonomy.json"'),
          ])

          replace('tooling/quality/probe.py', [
              ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parents[2]'),
              ('ROOT / "codegen" / "mistral"', 'ROOT / "tooling" / "pipeline" / "mistral"'),
              ('ROOT / "codegen/sdk-semantics.json"', 'ROOT / "tooling/pipeline/semantics.json"'),
              ('ROOT / "codegen/sdk-taxonomy.json"', 'ROOT / "tooling/sources/taxonomy.json"'),
              ('ROOT / "codegen/sdk-probe-baseline.json"', 'ROOT / "tooling/quality/probe-baseline.json"'),
          ])

          replace('tooling/quality/api_surface.py', [
              ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parents[2]'),
              ('ROOT / "codegen" / "mistral"', 'ROOT / "tooling" / "pipeline" / "mistral"'),
              ('ROOT / "codegen.lock"', 'ROOT / "tooling/sources/lock.json"'),
          ])

          replace('tooling/tests/run.py', [
              ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parents[2]'),
              ('sys.path.insert(0, str(ROOT / "codegen" / "mistral"))\nsys.path.insert(0, str(ROOT / "codegen"))\nsys.path.insert(0, str(ROOT / "scripts"))', 'sys.path.insert(0, str(ROOT / "tooling" / "pipeline" / "mistral"))\nsys.path.insert(0, str(ROOT / "tooling" / "pipeline"))\nsys.path.insert(0, str(ROOT / "tooling" / "sources"))\nsys.path.insert(0, str(ROOT / "tooling" / "quality"))'),
              ('str(ROOT / "codegen_tests")', 'str(ROOT / "tooling/tests")'),
          ])

          replace('tooling/tests/test_pipeline.py', [
              ('import codegen', 'import build as codegen'),
              ('import update_spec', 'import openapi as update_spec'),
              ('codegen.ROOT / "codegen.lock"', 'codegen.ROOT / "tooling/sources/lock.json"'),
              ('codegen.ROOT / "spec/openapi.yaml"', 'codegen.ROOT / "tooling/sources/openapi/openapi.yaml"'),
          ])
          replace('tooling/tests/test_coverage.py', [
              ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parents[2]'),
              ('ROOT / "codegen"', 'ROOT / "tooling" / "quality"'),
          ])
          # preprocess is in pipeline, not quality; make that import path explicit.
          p = root / 'tooling/tests/test_coverage.py'
          text = p.read_text().replace('sys.path.insert(0, str(ROOT / "tooling" / "quality"))\nimport coverage\nimport preprocess', 'sys.path.insert(0, str(ROOT / "tooling" / "quality"))\nsys.path.insert(0, str(ROOT / "tooling" / "pipeline"))\nimport coverage\nimport preprocess')
          p.write_text(text)

          replace('tooling/tests/test_sdk_autoproject.py', [
              ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parents[2]'),
              ('ROOT / "codegen"', 'ROOT / "tooling" / "pipeline" / "mistral"'),
          ])
          replace('tooling/tests/test_sdk_contracts.py', [
              ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parents[2]'),
              ('ROOT / "codegen" / "mistral"', 'ROOT / "tooling" / "pipeline" / "mistral"'),
          ])
          replace('tooling/tests/test_sdk_taxonomy.py', [
              ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parents[2]'),
              ('ROOT / "scripts"', 'ROOT / "tooling" / "sources"'),
              ('import sdk_taxonomy\nimport sdk_taxonomy_inventory', 'import taxonomy as sdk_taxonomy\nimport taxonomy_inventory as sdk_taxonomy_inventory'),
          ])

          replace('.gitignore', [('/.codegen-*/', '/.tooling-build-*/')])

          (root / 'tooling/README.md').write_text('''# SDK tooling sidecar\n\nThis directory is development tooling, not part of the Rust SDK runtime.\n\n- `sources/` tracks immutable OpenAPI, Python SDK and TypeScript SDK inputs and derives the compact Mistral product taxonomy.\n- `pipeline/` adapts those inputs through `openapi-to-rust`, `openapi-to-rust-bindings` and `rust-sdk-compiler` into committed Rust under `src/generated/` and `src/sdk/`.\n- `quality/` owns deterministic regeneration, coverage probes, public API/semver review and update reporting.\n- `tests/` exercises only this sidecar and its Mistral-specific contracts.\n\nThe OpenAPI remains the wire-contract source of truth. Official Python and TypeScript SDKs are evidence for product taxonomy and public surface only.\n''')

          (root / 'tooling/quality/validate.sh').write_text('''#!/usr/bin/env bash\nset -euo pipefail\ncd "$(dirname "$0")/../.."\npython3 tooling/pipeline/build.py check\npython3 tooling/sources/taxonomy_inventory.py check\ncargo fmt --all --check\ncargo check --locked --all-targets\ncargo clippy --locked --all-targets -- -D warnings\ncargo test --locked --all-targets\ncargo test --locked --doc\npython3 tooling/pipeline/build.py probe\n''')

          (root / 'tooling/quality/report.py').write_text(r'''"""Write a bounded mechanical update summary after validation succeeds."""\nfrom pathlib import Path\nimport json\nimport re\nimport subprocess\n\nROOT = Path(__file__).resolve().parents[2]\nLOCK = ROOT / "tooling/sources/lock.json"\nTAXONOMY = ROOT / "tooling/sources/taxonomy.json"\n\ndef git(*args):\n    return subprocess.check_output(["git", *args], cwd=ROOT, text=True)\n\ndef from_head(path):\n    return json.loads(git("show", f"HEAD:{path}"))\n\ndef operations(spec):\n    return set(re.findall(r"^\\s+operationId:\\s+(.+)$", spec, re.MULTILINE))\n\ndef mapping_delta(before, after):\n    before, after = before.get("operations", {}), after.get("operations", {})\n    return (sorted(after.keys() - before.keys()), sorted(before.keys() - after.keys()),\n            sorted(key for key in before.keys() & after.keys() if before[key] != after[key]))\n\ndef main():\n    changed = git("diff", "--name-only").splitlines()\n    changed += git("ls-files", "--others", "--exclude-standard").splitlines()\n    allowed = ("tooling/sources/", "src/generated/", "src/sdk/")\n    unexpected = [p for p in changed if not p.startswith(allowed) and p != "update-report.md"]\n    if unexpected:\n        raise ValueError(f"Unexpected files modified during source update: {unexpected}")\n\n    old_lock = from_head("tooling/sources/lock.json")\n    new_lock = json.loads(LOCK.read_text())\n    old_taxonomy = from_head("tooling/sources/taxonomy.json")\n    new_taxonomy = json.loads(TAXONOMY.read_text())\n    added_paths, removed_paths, changed_paths = mapping_delta(old_taxonomy, new_taxonomy)\n\n    old_spec = git("show", "HEAD:tooling/sources/openapi/openapi.yaml")\n    new_spec = (ROOT / "tooling/sources/openapi/openapi.yaml").read_text()\n    before, after = operations(old_spec), operations(new_spec)\n\n    with (ROOT / "update-report.md").open("w") as report:\n        report.write("Update the unofficial Rust SDK from tracked Mistral sources.\\n\\n")\n        for label, repo_key, commit_key in (\n            ("OpenAPI", "upstream_repository", "upstream_commit"),\n            ("Python SDK", "official_python_sdk_repository", "official_python_sdk_commit"),\n            ("TypeScript SDK", "official_typescript_sdk_repository", "official_typescript_sdk_commit"),\n        ):\n            old, new = old_lock[commit_key], new_lock[commit_key]\n            report.write(f"- {label}: `{old}` -> `{new}` ({new_lock[repo_key]})\\n")\n        report.write("\\nOpenAPI operation changes:\\n")\n        for label, values in (("Added", after - before), ("Removed", before - after)):\n            report.write(f"- {label}: {len(values)}\\n")\n            for value in sorted(values)[:30]:\n                report.write(f"  - `{value}`\\n")\n        report.write("\\nOfficial SDK taxonomy changes:\\n")\n        for label, values in (("Added mappings", added_paths), ("Removed mappings", removed_paths), ("Changed mappings", changed_paths)):\n            report.write(f"- {label}: {len(values)}\\n")\n            for value in values[:30]:\n                report.write(f"  - `{value}`\\n")\n        report.write(f"- Python/TS alias differences: {len(new_taxonomy.get('cross_sdk_alias_differences', []))}\\n")\n        report.write(f"- Python/TS divergences requiring review: {len(new_taxonomy.get('cross_sdk_divergences', []))}\\n")\n        report.write(f"- SDK-only surface digest changed: {old_taxonomy.get('sdk_only_digest') != new_taxonomy.get('sdk_only_digest')}\\n")\n        report.write("\\nChanged source/generated diff summary:\\n\\n```text\\n")\n        report.write(git("diff", "--stat", "--", "tooling/sources", "src/generated", "src/sdk"))\n        report.write("```\\n\\nChecks passed: pinned-source verification, raw generation, taxonomy harvesting, byte-for-byte regeneration, tooling tests, cargo fmt/check/clippy/tests/docs, coverage probe and public API review.\\n")\n\nif __name__ == "__main__":\n    main()\n'''.replace('\\n', '\n'))

          (root / 'Justfile').write_text('''generate:\n    python3 tooling/pipeline/build.py generate\n\ncheck-generated:\n    python3 tooling/pipeline/build.py check\n\nsync-openapi:\n    python3 tooling/sources/openapi.py\n\nsync-sdk-surface:\n    python3 tooling/sources/taxonomy.py pin-latest\n    python3 tooling/pipeline/build.py raw\n    python3 tooling/sources/taxonomy_inventory.py update\n    python3 tooling/pipeline/build.py generate\n\ntest-tooling:\n    python3 tooling/tests/run.py\n\nvalidate:\n    bash tooling/quality/validate.sh\n''')

          ci = root / '.github/workflows/ci.yml'
          ci.write_text('''name: CI\non:\n  push:\n  pull_request:\npermissions:\n  contents: read\nconcurrency:\n  group: ci-${{ github.workflow }}-${{ github.ref }}\n  cancel-in-progress: true\njobs:\n  validate:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 30\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n      - name: Install pinned Rust toolchain\n        run: rustup show\n      - uses: actions/cache@v4\n        with:\n          path: |\n            ~/.cargo/registry\n            ~/.cargo/git\n            .tools\n            target\n          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tooling/sources/lock.json') }}\n      - name: Validate tracked sources, generation and Rust SDK\n        run: bash tooling/quality/validate.sh\n      - name: Review generated public API changes\n        if: github.event_name == 'pull_request'\n        env:\n          SDK_API_BASE: ${{ github.event.pull_request.base.sha }}\n        run: python3 tooling/quality/api_surface.py --base "$SDK_API_BASE" --rustdoc\n''')

          update = root / '.github/workflows/update-sdk.yml'
          update.write_text('''name: Update Mistral SDK Sources\non:\n  schedule:\n    - cron: '23 3 * * *'\n  workflow_dispatch:\npermissions:\n  contents: write\n  pull-requests: write\nconcurrency:\n  group: update-mistral-sources\n  cancel-in-progress: false\njobs:\n  update:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 30\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: main\n      - name: Advance OpenAPI and official SDK source pins\n        id: upstream\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          python3 tooling/sources/openapi.py\n          python3 tooling/sources/taxonomy.py pin-latest\n          if git diff --quiet -- tooling/sources; then\n            echo 'changed=false' >> "$GITHUB_OUTPUT"\n          else\n            echo 'changed=true' >> "$GITHUB_OUTPUT"\n          fi\n      - name: Install pinned Rust toolchain\n        if: steps.upstream.outputs.changed == 'true'\n        run: rustup show\n      - uses: actions/cache@v4\n        if: steps.upstream.outputs.changed == 'true'\n        with:\n          path: |\n            ~/.cargo/registry\n            ~/.cargo/git\n            .tools\n            target\n          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tooling/sources/lock.json') }}\n      - name: Regenerate raw bindings for the updated OpenAPI\n        if: steps.upstream.outputs.changed == 'true'\n        run: python3 tooling/pipeline/build.py raw\n      - name: Reconcile official Python and TypeScript SDK surfaces\n        if: steps.upstream.outputs.changed == 'true'\n        run: python3 tooling/sources/taxonomy_inventory.py update\n      - name: Compile and validate the idiomatic Rust SDK\n        if: steps.upstream.outputs.changed == 'true'\n        run: |\n          python3 tooling/pipeline/build.py generate\n          bash tooling/quality/validate.sh\n      - name: Summarize source and surface changes\n        if: steps.upstream.outputs.changed == 'true'\n        run: |\n          python3 tooling/quality/report.py\n          cat update-report.md >> "$GITHUB_STEP_SUMMARY"\n      - name: Create or update the single SDK update PR\n        if: steps.upstream.outputs.changed == 'true'\n        uses: peter-evans/create-pull-request@v7\n        with:\n          token: ${{ github.token }}\n          branch: automation/update-mistral-sources\n          base: main\n          title: 'chore: update Mistral SDK sources'\n          commit-message: 'chore: update Mistral SDK sources'\n          body-path: update-report.md\n          delete-branch: true\n          add-paths: |\n            tooling/sources/\n            src/generated/\n            src/sdk/\n''')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          replacements = [
            ('Both are pinned independently in `codegen.lock`;', 'Both are pinned independently in `tooling/sources/lock.json`;'),
            ('bash scripts/validate.sh', 'just validate'),
            ('`codegen.lock` pins:', '`tooling/sources/lock.json` pins:'),
            ('On first use, `scripts/codegen.py` installs the pinned tools into `.tools/`.', 'On first use, `tooling/pipeline/build.py` installs the pinned tools into `.tools/`.'),
            ('| `codegen.lock` | Immutable source/toolchain provenance |\n| `spec/` | Unmodified official OpenAPI and upstream licensing |\n| `codegen/` | Mistral-specific raw-generator config/patches, semantic policy, projection and generation orchestration |\n| `codegen_tests/` | Repository-owned code-generation integration/policy tests |\n| `scripts/` | Acquisition, isolated generation, validation and update automation |', '| `tooling/sources/` | Immutable OpenAPI/Python/TypeScript source tracking, vendored OpenAPI and derived taxonomy |\n| `tooling/pipeline/` | Mistral adaptation and orchestration across openapi-to-rust, Bindings and rust-sdk-compiler |\n| `tooling/quality/` | Determinism, coverage, semver/public API review and update reporting |\n| `tooling/tests/` | Sidecar integration/policy tests |'),
            ('See [`codegen/README.md`](codegen/README.md) for the ownership map. The active Mistral semantic policy is [`codegen/sdk-semantics.json`](codegen/sdk-semantics.json).', 'See [`tooling/README.md`](tooling/README.md) for the ownership map. The active Mistral semantic policy is [`tooling/pipeline/semantics.json`](tooling/pipeline/semantics.json).'),
            ('See [NOTICE](NOTICE), [LICENSE-MIT](LICENSE-MIT), [LICENSE-APACHE](LICENSE-APACHE), [spec/LICENSE](spec/LICENSE) and [codegen/GENERATOR-LICENSE](codegen/GENERATOR-LICENSE).', 'See [NOTICE](NOTICE), [LICENSE-MIT](LICENSE-MIT), [LICENSE-APACHE](LICENSE-APACHE), [tooling/sources/openapi/LICENSE](tooling/sources/openapi/LICENSE) and [tooling/licenses/openapi-to-rust-MIT.txt](tooling/licenses/openapi-to-rust-MIT.txt).'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'README replacement missing: {old}')
              text = text.replace(old, new)
          p.write_text(text)

          p = Path('CONTRIBUTING.md')
          text = p.read_text()
          replacements = [
            ('Install Git, Rustup, Python 3.11+ with `venv`, and Just. Run commands from the repository root. Linux and macOS are the intended codegen environments; consumers need only Rust.', 'Install Git, Rustup, Python 3.11+ with `venv`, and Just. Run commands from the repository root. Linux and macOS are the intended tooling environments; consumers need only Rust.'),
            ('bash scripts/validate.sh', 'just validate'),
            ('Without Just, use `python3 scripts/codegen.py generate` and `python3 scripts/codegen.py check`.', 'Without Just, use `python3 tooling/pipeline/build.py generate` and `python3 tooling/pipeline/build.py check`.'),
            ('`codegen.lock` pins', '`tooling/sources/lock.json` pins'),
            ('`scripts/codegen.py` verifies', '`tooling/pipeline/build.py` verifies'),
            ('python3 scripts/update_report.py', 'python3 tooling/quality/report.py'),
            ('git diff -- spec codegen.lock src/generated src/sdk', 'git diff -- tooling/sources src/generated src/sdk'),
            ('`codegen/README.md` maps the repository-owned generation files. The active Mistral semantic policy is `codegen/sdk-semantics.json`;', '`tooling/README.md` maps the repository-owned sidecar. The active Mistral semantic policy is `tooling/pipeline/semantics.json`;'),
            ('`scripts/validate.sh` checks', '`tooling/quality/validate.sh` checks'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'CONTRIBUTING replacement missing: {old}')
              text = text.replace(old, new)
          p.write_text(text)

          p = Path('NOTICE')
          text = p.read_text().replace('spec/openapi.yaml', 'tooling/sources/openapi/openapi.yaml').replace('codegen.lock', 'tooling/sources/lock.json').replace('spec/LICENSE', 'tooling/sources/openapi/LICENSE').replace('codegen/openapi-to-rust.toml', 'tooling/pipeline/openapi-to-rust.toml').replace('codegen/GENERATOR-LICENSE', 'tooling/licenses/openapi-to-rust-MIT.txt')
          p.write_text(text)
          PY

          chmod +x tooling/quality/validate.sh
          python3 tooling/pipeline/build.py generate
          python3 tooling/sources/taxonomy_inventory.py check
          bash tooling/quality/validate.sh

          git rm .github/workflows/restructure-tooling-bootstrap.yml
          git add -A
          git commit -m "refactor: separate SDK tooling responsibilities"
          git push origin HEAD:cleanup/sdk-only-no-codegen

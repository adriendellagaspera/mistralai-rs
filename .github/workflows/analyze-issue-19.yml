name: Analyze issue 19
on:
  push:
    branches: [feat/complex-request-model-projection]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Classify request projection gaps
        run: |
          python3 -m venv /tmp/issue19
          /tmp/issue19/bin/pip install \
            'ruamel.yaml==0.18.6' \
            'tree-sitter==0.25.2' \
            'tree-sitter-rust==0.24.0' \
            'jsonschema==4.23.0'
          /tmp/issue19/bin/python scripts/analyze_issue_19.py

name: Evaluate complete API
# Exercise all transports, the generator source patch, and generated layout.
on:
  push:
    branches: [feat/full-api-coverage, feat/split-generated-code]
    paths:
      - .github/workflows/coverage-evaluate.yml
      - codegen/layout/**
      - scripts/codegen.py
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
            codegen/layout/target
          key: full-sdk-v2-${{ hashFiles('codegen.lock', 'codegen/layout/Cargo.toml', 'codegen/layout/Cargo.lock') }}
      - name: Lock layout tooling on bootstrap
        run: |
          if [ ! -f codegen/layout/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path codegen/layout/Cargo.toml
          fi
      - name: Generate all operations
        run: python scripts/codegen.py generate
      - name: Cache installed tooling even if generation fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
            codegen/layout/target
          key: full-sdk-v2-${{ hashFiles('codegen.lock', 'codegen/layout/Cargo.toml', 'codegen/layout/Cargo.lock') }}
      - name: Resolve added transport dependencies and format
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Validate
        run: bash scripts/validate.sh
      - name: Preserve generated evidence on this development branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src examples tests Cargo.lock codegen/layout/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore: regenerate complete API and split layout'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

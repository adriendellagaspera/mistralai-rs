name: Evaluate complete API
on:
  push:
    branches: [feat/full-api-coverage]
    paths: [.github/workflows/coverage-evaluate.yml]
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: full-sdk-v1-${{ hashFiles('codegen.lock') }}
      - name: Generate all operations
        run: python scripts/codegen.py generate
      - name: Cache installed tooling even if generation fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: full-sdk-v1-${{ hashFiles('codegen.lock') }}
      - name: Resolve added transport dependencies and format
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Validate
        run: bash scripts/validate.sh
      - name: Preserve generated evidence on this development branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src examples tests Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore: regenerate complete API and format'
            git push origin HEAD:feat/full-api-coverage
          fi

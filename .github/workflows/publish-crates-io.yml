name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: crates-io
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag, version and 288-operation package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('expected a vMAJOR.MINOR.PATCH release tag')
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          if tag != f'v{version}':
              raise SystemExit(f'tag {tag} does not match package version {version}')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tagged = subprocess.check_output(
              ['git', 'rev-parse', f'refs/tags/{tag}^{{commit}}'], text=True
          ).strip()
          if commit != tagged:
              raise SystemExit('checkout does not match the release tag')
          subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
          subprocess.run(['git', 'merge-base', '--is-ancestor', commit, 'FETCH_HEAD'], check=True)
          coverage = json.load(open('src/generated/coverage.json'))
          if len(coverage['operations']) != 288 or coverage['generated_methods'] != 297:
              raise SystemExit('release requires the published 288-operation source')
          PY
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify packaged crate
        run: cargo publish --dry-run --locked
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

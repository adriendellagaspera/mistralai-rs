name: Cut over 288 generated sources

on:
  push:
    branches:
      - feat/cutover-288

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Publish reviewed 288 candidate outputs
        run: cargo run --quiet --locked --manifest-path sdk-build/Cargo.toml -- candidate-publish
      - name: Commit generated cutover
        run: |
          git add src/generated src/sdk
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(sdk): publish generated 288 endpoint SDK"
          git push origin HEAD:feat/cutover-288

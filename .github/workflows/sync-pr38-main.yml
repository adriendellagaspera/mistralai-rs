name: Sync PR38 with main
on:
  push:
    branches: [issue-19-request-map-projection-ir]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main
        run: |
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'codegen.lock') }}
      - name: Validate complete repository
        run: bash scripts/validate.sh
      - name: Remove temporary workflow and push
        run: |
          rm .github/workflows/sync-pr38-main.yml
          git add -A
          git commit -m 'chore: remove temporary sync workflow'
          git push origin HEAD:issue-19-request-map-projection-ir

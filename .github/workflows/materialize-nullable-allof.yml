name: Materialize nullable allOf intersection
on:
  push:
    branches: [rust-sdk-compiler-nullable-allof]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust-sdk-compiler-nullable-allof
          fetch-depth: 0
      - name: Apply generic nullable refinement
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          api = Path('src/rust_sdk_compiler/api.py')
          text = api.read_text()
          marker = '''def _intersect_property_schema(\n    left: dict[str, Any], right: dict[str, Any], *, context: str\n) -> dict[str, Any]:\n    if left == right:\n        return deepcopy(left)\n\n'''
          replacement = '''def _nullable_property_inner(schema: dict[str, Any]) -> dict[str, Any] | None:\n    branches = schema.get("anyOf")\n    allowed = _SCHEMA_ANNOTATIONS | {"anyOf", "default"}\n    if (\n        not isinstance(branches, list)\n        or len(branches) != 2\n        or any(key not in allowed for key in schema)\n    ):\n        return None\n    nulls = [branch for branch in branches if branch == {"type": "null"}]\n    values = [branch for branch in branches if branch != {"type": "null"}]\n    if len(nulls) != 1 or len(values) != 1 or not isinstance(values[0], dict):\n        return None\n    inner = deepcopy(values[0])\n    for key in _SCHEMA_ANNOTATIONS:\n        if key in schema and key not in inner:\n            inner[key] = deepcopy(schema[key])\n    if schema.get("default") is not None and "default" not in inner:\n        inner["default"] = deepcopy(schema["default"])\n    return inner\n\n\ndef _intersect_property_schema(\n    left: dict[str, Any], right: dict[str, Any], *, context: str\n) -> dict[str, Any]:\n    if left == right:\n        return deepcopy(left)\n\n    left_inner = _nullable_property_inner(left)\n    right_inner = _nullable_property_inner(right)\n    if left_inner is not None and right_inner is None:\n        return _intersect_property_schema(left_inner, right, context=context)\n    if right_inner is not None and left_inner is None:\n        return _intersect_property_schema(left, right_inner, context=context)\n\n'''
          if marker not in text:
              raise SystemExit('intersection marker not found')
          api.write_text(text.replace(marker, replacement, 1))

          fixture = Path('tests/fixtures/composed-openapi/openapi.json')
          text = fixture.read_text()
          anchor = '''      "ImpossibleCommand": {\n'''
          insertion = '''      "NullableStreamingCommandBase": {\n        "type": "object",\n        "properties": {\n          "stream": {"anyOf": [{"type": "boolean"}, {"type": "null"}], "default": null}\n        }\n      },\n      "NonStreamingNullableCommand": {\n        "allOf": [\n          {"$ref": "#/components/schemas/NullableStreamingCommandBase"},\n          {\n            "type": "object",\n            "properties": {\n              "stream": {"type": "boolean", "enum": [false], "default": false}\n            }\n          }\n        ]\n      },\n      "InvalidNullableRefinement": {\n        "allOf": [\n          {"$ref": "#/components/schemas/NullableStreamingCommandBase"},\n          {"type": "object", "properties": {"stream": {"type": "string", "enum": ["never"]}}}\n        ]\n      },\n'''
          if anchor not in text:
              raise SystemExit('fixture insertion point not found')
          fixture.write_text(text.replace(anchor, insertion + anchor, 1))

          tests = Path('tests/test_openapi.py')
          text = tests.read_text()
          anchor = '    def test_object_schema_rejects_empty_literal_intersection(self):\n'
          insertion = '''    def test_object_schema_intersects_nullable_non_null_refinement(self):\n        schema = self.openapi.object_schema("NonStreamingNullableCommand")\n        self.assertEqual(\n            schema["properties"]["stream"],\n            {"type": "boolean", "enum": [False], "default": False},\n        )\n\n    def test_object_schema_rejects_incompatible_nullable_refinement(self):\n        with self.assertRaisesRegex(\n            GenerationError, "conflicting OpenAPI property InvalidNullableRefinement.stream"\n        ):\n            self.openapi.object_schema("InvalidNullableRefinement")\n\n'''
          if anchor not in text:
              raise SystemExit('test insertion point not found')
          tests.write_text(text.replace(anchor, insertion + anchor, 1))

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text()
          if 'version = "0.2.6"' not in text:
              raise SystemExit('unexpected pyproject version')
          pyproject.write_text(text.replace('version = "0.2.6"', 'version = "0.2.7"', 1))

          init = Path('src/rust_sdk_compiler/__init__.py')
          text = init.read_text()
          if '__version__ = "0.2.6"' not in text:
              raise SystemExit('unexpected package version')
          init.write_text(text.replace('__version__ = "0.2.6"', '__version__ = "0.2.7"', 1))
          PY
      - name: Validate standalone compiler
        run: |
          python3 -m pip install -q .
          python3 -m unittest discover -s tests -v
      - name: Commit materialized compiler
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/materialize-nullable-allof.yml
          git add src/rust_sdk_compiler/api.py src/rust_sdk_compiler/__init__.py pyproject.toml tests/test_openapi.py tests/fixtures/composed-openapi/openapi.json
          git commit -m 'fix: intersect nullable allOf refinements'
          git push origin HEAD:rust-sdk-compiler-nullable-allof
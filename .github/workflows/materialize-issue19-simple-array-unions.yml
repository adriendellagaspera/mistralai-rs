name: Materialize issue 19 simple array unions
on:
  push:
    branches: [issue-19-allof-request-projection]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-19-allof-request-projection
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Apply compiler pin and simple-array union projection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          lock_path = Path('tooling/sources/lock.json')
          lock = json.loads(lock_path.read_text())
          lock.update({
              'compiler_tool_version': '0.2.8',
              'compiler_tool_commit': 'da67081e85b34859232b5b60451de72f44b0fb7e',
              'compiler_tool_tree_sha': '0af56d0e8f82de0b2433d3a6181890994c52abf7',
          })
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          path = Path('tooling/pipeline/mistral/sdk_autoproject.py')
          text = path.read_text()
          start = text.index('def _primitive_union_payload(')
          end = text.index('\ndef _request_field_adapter(', start)
          replacement = '''def _primitive_union_payload(schema: dict[str, Any]) -> str | None:\n    if "$ref" in schema or "enum" in schema or "const" in schema or "format" in schema:\n        return None\n    return {\n        "string": "String",\n        "integer": "i64",\n        "number": "f64",\n        "boolean": "bool",\n    }.get(schema.get("type"))\n\n\ndef _union_branch_matches(schema: dict[str, Any], payload: str, rust: Any) -> bool:\n    reference = _schema_ref(schema)\n    if reference is not None:\n        return payload == reference\n    syntax = _expand_raw_alias(parse_type(payload), rust)\n    if syntax is None:\n        return False\n    primitive = _primitive_union_payload(schema)\n    if primitive is not None:\n        return syntax.spelling == primitive\n    if schema.get("type") != "array":\n        return False\n    inner = syntax.unary("Vec")\n    if inner is None:\n        return False\n    item = _primitive_union_payload(schema.get("items", {}))\n    if item is None:\n        return False\n    expanded_inner = _expand_raw_alias(inner, rust)\n    return expanded_inner is not None and expanded_inner.spelling == item\n\n\ndef _ensure_union_model(models: dict[str, Any], schemas: dict[str, Any], schema: dict[str, Any],\n                        raw: str, rust: Any, resolving: tuple[str, ...]) -> tuple[str | None, str | None]:\n    existing = _existing_model_by_raw(models, raw, False)\n    if existing:\n        return existing, None\n    branches = schema.get("oneOf", []) or schema.get("anyOf", [])\n    non_null = [branch for branch in branches if branch.get("type") != "null"]\n    if len(non_null) < 2 or raw not in rust.enums:\n        return None, "request_model_projection"\n    variants = rust.enums[raw]\n    if any(variant.payload is None for variant in variants):\n        return None, "request_model_projection"\n\n    expected: list[tuple[dict[str, Any], Any, str | None]] = []\n    used: set[str] = set()\n    references: list[str] = []\n    for branch in non_null:\n        matches = [\n            variant for variant in variants\n            if variant.name not in used\n            and _union_branch_matches(branch, variant.payload, rust)\n        ]\n        if len(matches) != 1:\n            return None, "request_model_projection"\n        variant = matches[0]\n        used.add(variant.name)\n        reference = _schema_ref(branch)\n        expected.append((branch, variant, reference))\n        if reference is not None:\n            references.append(reference)\n    if len(used) != len(variants):\n        return None, "request_model_projection"\n\n    discriminator = schema.get("discriminator", {})\n    mapping = discriminator.get("mapping", {}) if isinstance(discriminator, dict) else {}\n    tags_by_ref = {\n        value.rsplit("/", 1)[-1]: tag\n        for tag, value in mapping.items()\n        if isinstance(value, str)\n    }\n    if mapping and (len(references) != len(expected) or set(tags_by_ref) != set(references)):\n        return None, "request_model_projection"\n\n    facade_variants: dict[str, Any] = {}\n    seen_public: set[str] = set()\n    for branch, variant, reference in expected:\n        adapter = None\n        if reference is not None:\n            adapter, reason = _request_field_adapter(\n                models, schemas, branch, variant.payload, rust, resolving, reference, ()\n            )\n            if reason:\n                return None, reason\n        label = tags_by_ref.get(reference, reference) if reference is not None else branch.get("type")\n        public = _pascal(str(label).lower() if reference in tags_by_ref else str(label))\n        if not public or public in seen_public:\n            return None, "request_model_projection"\n        seen_public.add(public)\n        facade_variants[variant.name] = (\n            {"name": public, "adapter": adapter} if adapter else public\n        )\n\n    name = _union_name(raw)\n    if name in models and models[name].get("raw", name) != raw:\n        return None, "request_model_projection"\n    models[name] = {"raw": raw, "simple_union": {"variants": facade_variants}}\n    return name, None\n\n'''
          path.write_text(text[:start] + replacement + text[end + 1:])

          tests = Path('tooling/tests/test_sdk_autoproject.py')
          text = tests.read_text()
          anchor = '    def test_projects_discriminated_request_union_without_raw_type_leaks(self):\n'
          insertion = '''    def test_projects_inline_simple_array_request_union(self):\n        api = FakeOpenApi()\n        api.schemas.update({\n            "CreateThing": {\n                "type": "object", "required": ["stop"],\n                "properties": {\n                    "stop": {"$ref": "#/components/schemas/StopChoice"},\n                },\n            },\n            "StopChoice": {\n                "anyOf": [\n                    {"type": "string"},\n                    {"type": "array", "items": {"type": "string"}},\n                    {"type": "null"},\n                ]\n            },\n        })\n        fields = {\n            "CreateThing": (SimpleNamespace(name="stop", type="StopChoice"),),\n        }\n        enums = {\n            "StopChoice": (\n                SimpleNamespace(name="String", payload="String"),\n                SimpleNamespace(name="StringArray", payload="StopStringArray"),\n            ),\n        }\n        aliases = {"StopStringArray": parse_type("Vec<String>")}\n        rust = SimpleNamespace(\n            structs=set(fields), aliases=aliases, enums=enums,\n            symbol_paths={name: "types" for name in (*fields, *enums, *aliases)},\n            fields=lambda name: fields[name],\n        )\n        expanded, report = sdk_autoproject.expand_manifest(\n            api, manifest(), {"operations": {"create_thing": ["things.create"]}},\n            raw_coverage("create_thing"), rust,\n        )\n        self.assertEqual(1, report["added_count"])\n        self.assertEqual(\n            {"stop": "StopChoiceValue"},\n            expanded["models"]["CreateThingParams"]["adapters"],\n        )\n        self.assertEqual(\n            {"String": "String", "StringArray": "Array"},\n            expanded["models"]["StopChoiceValue"]["simple_union"]["variants"],\n        )\n\n'''
          if anchor not in text:\n              raise SystemExit('test insertion anchor not found')\n          tests.write_text(text.replace(anchor, insertion + anchor, 1))\n          PY
      - name: Regenerate and validate consumer
        run: |
          set -euo pipefail
          python3 tooling/pipeline/build.py generate
          bash tooling/quality/validate.sh
      - name: Commit materialized consumer
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/diagnose-issue19.yml .github/workflows/materialize-issue19-simple-array-unions.yml
          git add tooling/pipeline/mistral/sdk_autoproject.py tooling/sources/lock.json tooling/tests/test_sdk_autoproject.py src/generated src/sdk
          git commit -m 'feat: project simple array request unions'
          git push origin HEAD:issue-19-allof-request-projection

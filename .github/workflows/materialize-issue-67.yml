name: Materialize issue 67 binding manifest

on:
  push:
    branches: [issue-67-openapi-overlays]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-67-openapi-overlays
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Show patch digest
        run: sha256sum tooling/pipeline/openapi-to-rust.patch
      - name: Generate raw bindings and manifest
        run: python3 tooling/pipeline/build.py raw
      - name: Remove one-shot workflow
        run: rm .github/workflows/materialize-issue-67.yml
      - name: Commit generated state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+adriendellagaspera@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "build: materialize binding manifest"
          git push origin HEAD:issue-67-openapi-overlays

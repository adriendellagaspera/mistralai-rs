name: Materialize bulk projection
on:
  push:
    branches:
      - feat/taxonomy-bulk-projection
permissions:
  contents: write
concurrency:
  group: materialize-taxonomy-bulk-projection
  cancel-in-progress: true
jobs:
  materialize:
    if: github.repository == 'adriendellagaspera/mistralai-rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply proven compiler changes
        run: |
          git apply -p1 codegen/sdk_codegen.patch
          git apply -p1 scripts/test_sdk_facade.patch
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'codegen.lock') }}
      - name: Generate facade and reviewed probe baseline
        run: |
          python3 scripts/codegen.py generate
          PYTHON=$(find .tools -path '*python-sdk-codegen*/bin/python' -type f | head -1)
          "$PYTHON" - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'codegen'))
          sys.path.insert(0, str(ROOT / 'scripts'))
          import sdk_codegen as compiler
          import probe_sdk_coverage as probe
          openapi = compiler.OpenApiIndex.load(ROOT / 'spec/openapi.yaml')
          rust = compiler.RustIndex.load(ROOT / 'src/generated')
          configured = json.loads((ROOT / 'codegen/sdk-semantics.json').read_text())
          configured, _ = compiler.expand_manifest(
              openapi,
              configured,
              json.loads((ROOT / 'codegen/sdk-taxonomy.json').read_text()),
              json.loads((ROOT / 'src/generated/coverage.json').read_text()),
          )
          modules, rejected = probe.probes(openapi, rust, configured)
          report = {'generated_candidates': sorted(modules), 'rejected_candidates': rejected}
          digest = hashlib.sha256(
              json.dumps(report, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          baseline = {
              'schema_version': 1,
              'generated_candidates': len(modules),
              'rejected_candidates': len(rejected),
              'report_sha256': digest,
          }
          (ROOT / 'codegen/sdk-probe-baseline.json').write_text(
              json.dumps(baseline, indent=2) + '\n'
          )
          print(json.dumps(baseline, indent=2))
          PY
          bash scripts/validate.sh
      - name: Replace prototype machinery with committed sources
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm codegen/sdk_codegen.patch scripts/test_sdk_facade.patch
          rm .github/workflows/materialize-bulk.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: auto-project official SDK taxonomy'
          git push origin HEAD:feat/taxonomy-bulk-projection

name: Materialize bulk projection
on:
  push:
    branches:
      - feat/taxonomy-bulk-projection
permissions:
  contents: write
concurrency:
  group: materialize-taxonomy-bulk-projection
  cancel-in-progress: true
jobs:
  materialize:
    if: github.repository == 'adriendellagaspera/mistralai-rs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply proven compiler changes
        run: |
          git apply -p1 codegen/sdk_codegen.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test_sdk_facade.py')
          source = path.read_text()
          marker = '    def test_optional_query_addition_preserves_resource_signature(self):\n'
          nested = '''    def test_nested_resources_emit_hierarchical_accessors(self):
              operation = sdk_codegen.OperationSpec("list", "list", "list", None, "Receipt", (), None)
              root = sdk_codegen.ResourceSpec(("batch",), "batch", "Batch", ())
              child = sdk_codegen.ResourceSpec(("batch", "jobs"), "batch_jobs", "BatchJobs", (operation,))
              rust = sdk_codegen.RustIndex(
                  TYPES.encode(),
                  b"impl HttpClient { pub async fn list(&self) -> Result<AnimalResponse, Error> { todo!() } }",
              )
              root_source = sdk_codegen._emit_resource(root, rust, (root, child))
              mod_source = sdk_codegen._emit_mod(sdk_codegen.SdkIr("Client", (), (root, child)))
              self.assertIn("pub fn jobs(&self) -> BatchJobs<'a>", root_source)
              self.assertIn("pub fn batch(&self) -> Batch<'_>", mod_source)
              self.assertNotIn("pub fn batch_jobs(&self)", mod_source)

          '''
          if marker not in source:
              raise SystemExit('optional query test marker not found')
          source = source.replace(marker, nested + marker, 1)
          source = source.replace(
              'resource = sdk_codegen.ResourceSpec("zoo", "Zoo", (operation,))',
              'resource = sdk_codegen.ResourceSpec(("zoo",), "zoo", "Zoo", (operation,))',
              1,
          )
          source = source.replace(
              'before = sdk_codegen._emit_resource(resource, old)',
              'before = sdk_codegen._emit_resource(resource, old, (resource,))',
              1,
          )
          source = source.replace(
              'after = sdk_codegen._emit_resource(resource, new)',
              'after = sdk_codegen._emit_resource(resource, new, (resource,))',
              1,
          )
          path.write_text(source)
          PY
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'codegen.lock') }}
      - name: Generate facade and reviewed probe baseline
        run: |
          python3 scripts/codegen.py generate
          PYTHON=$(find .tools -path '*python-sdk-codegen*/bin/python' -type f | head -1)
          "$PYTHON" - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'codegen'))
          sys.path.insert(0, str(ROOT / 'scripts'))
          import sdk_codegen as compiler
          import probe_sdk_coverage as probe
          openapi = compiler.OpenApiIndex.load(ROOT / 'spec/openapi.yaml')
          rust = compiler.RustIndex.load(ROOT / 'src/generated')
          configured = json.loads((ROOT / 'codegen/sdk-semantics.json').read_text())
          configured, _ = compiler.expand_manifest(
              openapi,
              configured,
              json.loads((ROOT / 'codegen/sdk-taxonomy.json').read_text()),
              json.loads((ROOT / 'src/generated/coverage.json').read_text()),
          )
          modules, rejected = probe.probes(openapi, rust, configured)
          report = {'generated_candidates': sorted(modules), 'rejected_candidates': rejected}
          digest = hashlib.sha256(
              json.dumps(report, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          baseline = {
              'schema_version': 1,
              'generated_candidates': len(modules),
              'rejected_candidates': len(rejected),
              'report_sha256': digest,
          }
          (ROOT / 'codegen/sdk-probe-baseline.json').write_text(
              json.dumps(baseline, indent=2) + '\n'
          )
          print(json.dumps(baseline, indent=2))
          PY
          bash scripts/validate.sh
      - name: Replace prototype machinery with committed sources
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm codegen/sdk_codegen.patch scripts/test_sdk_facade.patch
          rm .github/workflows/materialize-bulk.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: auto-project official SDK taxonomy'
          git push origin HEAD:feat/taxonomy-bulk-projection

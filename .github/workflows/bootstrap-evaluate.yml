name: Bootstrap SDK validation
on:
  push:
    branches: [feat/generated-sdk]
    paths:
      - '.github/workflows/bootstrap-evaluate.yml'
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo
            .tools
            target
          key: bootstrap-sdk-0.16.0-rust-1.94.0
      - name: Generate committed SDK and dependency lock
        run: |
          python3 scripts/codegen.py generate
          cargo generate-lockfile
          cargo fmt --all
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo
            .tools
            target
          key: bootstrap-sdk-0.16.0-rust-1.94.0
      - name: Validate complete SDK
        run: bash scripts/validate.sh
      - name: Preserve generated sources and formatted tests on development branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src examples tests Cargo.lock
          git diff --cached --quiet || git commit -m "chore: generate SDK and format bootstrap sources"
          git push origin HEAD:feat/generated-sdk

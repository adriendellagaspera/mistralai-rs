name: Monitor Published Mistral OpenAPI

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  public-catalog:
    name: Weekly upstream drift and remediation check
    permissions:
      actions: write # Explicitly dispatch CI for commits created with GITHUB_TOKEN.
      contents: write # Commit reviewed upstream candidates on the automation branch.
      pull-requests: write # Create or update the single upstream remediation PR.
    uses: ./.github/workflows/update-sdk.yml
    with:
      badge_scope: spec

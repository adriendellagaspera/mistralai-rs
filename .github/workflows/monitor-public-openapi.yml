name: Monitor Published Mistral OpenAPI

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-catalog:
    name: Independently check the public API catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare public catalog with reviewed fingerprint
        run: python3 sdk-build/openapi/monitor_public.py

name: Update Mistral SDK Sources

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-mistral-sources
  cancel-in-progress: false

jobs:
  update:
    name: update
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # Create/update the stable automation branch.
      pull-requests: write # Create/update the single source-update PR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Advance OpenAPI and official SDK source pins
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 sdk-build/openapi/update.py
          python3 sdk-build/official-sdks/update.py pin-latest
          if git diff --quiet -- sdk-build/openapi sdk-build/official-sdks sdk-build/provenance.lock.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned Rust toolchain
        if: steps.upstream.outputs.changed == 'true'
        run: rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.upstream.outputs.changed == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'sdk-build/provenance.lock.json') }}
      - name: Regenerate raw bindings for the updated OpenAPI
        id: raw
        if: steps.upstream.outputs.changed == 'true'
        continue-on-error: true
        run: python3 sdk-build/build.py raw
      - name: Reconcile official Python and TypeScript SDK surfaces
        id: surface
        if: steps.raw.outcome == 'success'
        continue-on-error: true
        run: python3 sdk-build/official-sdks/update.py update
      - name: Compile and validate the idiomatic Rust SDK
        id: validation
        if: steps.surface.outcome == 'success'
        continue-on-error: true
        run: |
          python3 sdk-build/build.py generate
          python3 sdk-build/build.py check
          python3 sdk-build/official-sdks/update.py check
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Summarize source and surface changes
        if: always() && steps.upstream.outputs.changed == 'true'
        env:
          RAW_OUTCOME: ${{ steps.raw.outcome }}
          SURFACE_OUTCOME: ${{ steps.surface.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          python3 .github/scripts/update_report.py
          printf '\nValidation: raw=%s, official surface=%s, SDK=%s.\n' "$RAW_OUTCOME" "$SURFACE_OUTCOME" "$VALIDATION_OUTCOME" >> update-report.md
          cat update-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update the single SDK update PR
        if: always() && steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=automation/update-mistral-sources
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdk-build/openapi/ sdk-build/official-sdks/ sdk-build/provenance.lock.json src/generated/ src/sdk/
          git commit -m 'chore: update Mistral SDK sources'
          gh auth setup-git
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          pr_number="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title 'chore: update Mistral SDK sources' \
              --body-file update-report.md
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title 'chore: update Mistral SDK sources' \
              --body-file update-report.md
          fi
      - name: Fail after publishing a blocked source-update PR
        if: always() && steps.upstream.outputs.changed == 'true'
        env:
          RAW_OUTCOME: ${{ steps.raw.outcome }}
          SURFACE_OUTCOME: ${{ steps.surface.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          test "$RAW_OUTCOME" = success
          test "$SURFACE_OUTCOME" = success
          test "$VALIDATION_OUTCOME" = success

name: Update Mistral SDK Sources

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-mistral-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show
      - run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - run: npm install --global 'fern-api@5.112.0'
      - name: Advance pinned upstream evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 sdk-build/openapi/update.py
          python3 sdk-build/official-sdks/update.py pin-latest --source python
          python3 sdk-build/official-sdks/update.py pin-latest --source typescript
      - name: Detect upstream change
        id: changed
        run: |
          if git diff --quiet -- sdk-build/openapi sdk-build/official-sdks sdk-build/provenance.lock.json; then
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - name: Generate and validate candidate
        if: steps.changed.outputs.changed == 'true'
        run: |
          python3 sdk-build/official-sdks/update.py update
          python3 sdk-build/fern/build.py generate
          cargo fmt --all --check
          cargo check --locked --all-features
          cargo clippy --locked --all-features --all-targets -- -D clippy::correctness -D clippy::suspicious
          cargo test --locked --all-features --all-targets
          python3 sdk-build/fern/build.py check
          python3 sdk-build/official-sdks/update.py check
      - name: Open or update review PR
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=automation/update-mistral-sources
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A sdk-build/openapi sdk-build/official-sdks sdk-build/provenance.lock.json sdk-build/fern/public-inventory.json src
          git commit -m 'chore: update Mistral SDK sources'
          gh auth setup-git
          git push --force origin "HEAD:refs/heads/$branch"
          pr="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          body='Pinned upstream evidence changed. This candidate was regenerated exclusively with Fern and passed the production closure, determinism, Rust, and transport gates.'
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title 'chore: update Mistral SDK sources' --body "$body"
          else
            gh pr create --base main --head "$branch" --title 'chore: update Mistral SDK sources' --body "$body"
          fi

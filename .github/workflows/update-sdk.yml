name: Update Mistral SDK Sources
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-mistral-sources
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Advance OpenAPI and official SDK source pins
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tooling/sources/openapi.py
          python3 tooling/sources/taxonomy.py pin-latest
          if git diff --quiet -- tooling/sources; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned Rust toolchain
        if: steps.upstream.outputs.changed == 'true'
        run: rustup show
      - uses: actions/cache@v4
        if: steps.upstream.outputs.changed == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tooling/sources/lock.json') }}
      - name: Regenerate raw bindings for the updated OpenAPI
        if: steps.upstream.outputs.changed == 'true'
        run: python3 tooling/pipeline/build.py raw
      - name: Reconcile official Python and TypeScript SDK surfaces
        if: steps.upstream.outputs.changed == 'true'
        run: python3 tooling/sources/taxonomy_inventory.py update
      - name: Compile and validate the idiomatic Rust SDK
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python3 tooling/pipeline/build.py generate
          bash tooling/quality/validate.sh
      - name: Summarize source and surface changes
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python3 tooling/quality/report.py
          cat update-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update the single SDK update PR
        if: steps.upstream.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/update-mistral-sources
          base: main
          title: 'chore: update Mistral SDK sources'
          commit-message: 'chore: update Mistral SDK sources'
          body-path: update-report.md
          delete-branch: true
          add-paths: |
            tooling/sources/
            src/generated/
            src/sdk/

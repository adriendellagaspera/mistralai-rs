name: Update Mistral SDK Sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sdk.yml'
      - '.github/workflows/monitor-public-openapi.yml'
      - 'sdk-build/**'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      badge_scope:
        description: Which upstream must match for this workflow's badge.
        type: string
        required: false
        default: sdk

permissions: {}

concurrency:
  group: update-mistral-sources
  cancel-in-progress: false

jobs:
  update:
    name: Check OpenAPI and official SDK alignment
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: write # Explicitly dispatch CI for commits created with GITHUB_TOKEN.
      contents: write # Commit unapproved candidate sources, subject to GitHub PR review.
      pull-requests: write # Create or update the single upstream remediation PR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show
      - run: npm install --global fern-api@5.112.0 # zizmor: ignore[adhoc-packages]
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Probe all upstream sources independently
        id: probe
        run: python3 sdk-build/monitoring/watch.py prepare
      - name: Regenerate and validate candidate
        id: generate
        if: steps.probe.outputs.changed == 'true'
        continue-on-error: true
        run: |
          bash sdk-build/fern/generate.sh
          python3 sdk-build/official-sdks/update.py update
          cargo generate-lockfile
          bash sdk-build/fern/check.sh
          python3 sdk-build/official-sdks/update.py check
          cargo fmt --all --check
          cargo check --locked --all-features
          cargo clippy --locked --all-features -- -D clippy::correctness -D clippy::suspicious
          cargo test --locked --all-features --all-targets
          # Generated source is intentionally dirty until the candidate commit.
          # The regular CI publication check remains strict after that commit.
          cargo publish --dry-run --locked --allow-dirty
      - name: Write deterministic review report
        if: always() && steps.probe.outputs.changed == 'true'
        env:
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
        run: python3 sdk-build/monitoring/watch.py finish --generation "$GENERATION_OUTCOME"
      - name: Create or update one remediation PR
        if: always() && steps.probe.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=automation/update-mistral-sources
          # Do not force-push over developer fixes or an approved PR. If
          # review is underway, raise drift via the existing health check
          # and leave the human candidate unchanged.
          remote_ref="refs/remotes/origin/$branch"
          if git show-ref --verify --quiet "$remote_ref"; then
            human_authors="$(git log --format='%ae' "origin/main..$remote_ref" | grep -vFx '41898282+github-actions[bot]@users.noreply.github.com' || true)"
            if [ -n "$human_authors" ]; then
              echo "::warning::Human changes exist on $branch; refusing to overwrite them. Update the candidate manually."
              exit 0
            fi
            existing_pr="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
            if [ -n "$existing_pr" ]; then
              approval_count="$(gh pr view "$existing_pr" --json reviews --jq '[.reviews[] | select(.state == "APPROVED")] | length')"
              if [ "$approval_count" -gt 0 ]; then
                echo "::warning::PR #$existing_pr has an approval; refusing to invalidate it with an automatic push."
                exit 0
              fi
            fi
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A sdk-build/openapi sdk-build/official-sdks sdk-build/provenance.lock.json sdk-build/fern sdk-build/monitoring/STATUS.md src Cargo.lock
          if git diff --cached --quiet; then
            echo "::error::Upstream drift was detected but no candidate or report was staged"
            exit 1
          fi
          candidate_tree="$(git write-tree)"
          remote_tree="$(git rev-parse "refs/remotes/origin/$branch^{tree}" 2>/dev/null || true)"
          gh auth setup-git
          if [ "$candidate_tree" != "$remote_tree" ]; then
            git commit -m 'chore: synchronize Mistral upstream specifications and SDKs'
            git push --force origin "HEAD:refs/heads/$branch"
            updated=true
          else
            echo "Remediation candidate is unchanged; keeping existing PR commit"
            updated=false
          fi
          pr="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          created=false
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title 'chore: synchronize Mistral upstream sources' --body-file sdk-build/monitoring/STATUS.md
          else
            gh pr create --base main --head "$branch" --title 'chore: synchronize Mistral upstream sources' --body-file sdk-build/monitoring/STATUS.md
            created=true
          fi
          # GITHUB_TOKEN-created PR/push events do not themselves trigger CI.
          if [ "$updated" = true ] || [ "$created" = true ]; then
            gh workflow run ci.yml --ref "$branch"
          fi
      - name: Report upstream alignment
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          CHANGED: ${{ steps.probe.outputs.changed }}
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
          BADGE_SCOPE: ${{ inputs.badge_scope || 'sdk' }}
        run: |
          if [ "$PROBE_OUTCOME" != success ]; then
            echo "::error::Upstream probe could not complete"
            exit 1
          fi
          python3 sdk-build/monitoring/watch.py health --scope "$BADGE_SCOPE"

name: Diagnose issue 19 request gaps
on:
  push:
    branches: [issue-19-allof-request-projection]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-19-allof-request-projection
      - name: Bootstrap focused tooling
        run: |
          set -euo pipefail
          python3 -m venv .diag-venv
          .diag-venv/bin/pip install -q \
            ruamel.yaml==0.18.6 tree-sitter==0.25.2 tree-sitter-rust==0.24.0 jsonschema==4.23.0
          git clone -q https://github.com/adriendellagaspera/mistralai-rs.git /tmp/compiler
          git -C /tmp/compiler checkout -q 87300dfcb69ad8a86deb09c3ffeccd6c62e803bf
          .diag-venv/bin/pip install -q /tmp/compiler
          git clone -q https://github.com/adriendellagaspera/mistralai-rs.git /tmp/bindings
          git -C /tmp/bindings checkout -q 394600cee5c3955b51c545c05986814f7a7ddd1c
          .diag-venv/bin/pip install -q /tmp/bindings
      - name: Diagnose request fields
        run: |
          set -euo pipefail
          .diag-venv/bin/python - <<'PY'
          import sys
          from pathlib import Path
          from openapi_to_rust_bindings import read_bindings
          from rust_sdk_compiler import OpenApi
          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'tooling/pipeline/mistral'))
          import sdk_autoproject as a
          api = OpenApi.load(ROOT / 'tooling/sources/openapi/openapi.yaml')
          rust = read_bindings(ROOT / 'src/generated')
          schemas = dict(api.schemas)
          for name, schema in list(api.schemas.items()):
              if schema.get('allOf'):
                  try:
                      schemas[name] = api.object_schema(name)
                  except Exception as exc:
                      print(f'NORMALIZE {name}: {exc}')
          for raw in ['ConversationAppendRequest','ConversationRestartRequest','ConversationRequest']:
              schema = schemas[raw]
              fields = {f.name.removeprefix('r#'): f for f in rust.fields(raw)}
              print(f'\nMODEL {raw}')
              print('schema_fields=', sorted(schema.get('properties', {})))
              print('raw_fields=', sorted(fields))
              models = {}
              required = set(schema.get('required', []))
              for field, fs in sorted(schema.get('properties', {}).items()):
                  if field not in fields:
                      print(field, 'MISSING_RAW')
                      continue
                  if field not in required and a._omittable_singleton(fs, fields[field].type, schemas, rust):
                      print(field, fields[field].type, 'OMIT_SINGLETON')
                      continue
                  adapter, reason = a._request_field_adapter(
                      models, schemas, fs, fields[field].type, rust, (raw,), raw, (field,)
                  )
                  print(field, fields[field].type, 'adapter=', adapter, 'reason=', reason)
          PY
name: Diagnose issue 19 request projection
on:
  push:
    branches: [issue-19-allof-request-projection]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-19-allof-request-projection
      - name: Prepare generated SDK and tooling
        run: python3 tooling/pipeline/build.py generate
      - name: Diagnose request fields
        run: |
          set -euo pipefail
          PYTHON=$(find .tools -path '*/bin/python' | grep 'python-sdk-tooling' | head -1)
          "$PYTHON" - <<'PY'
          import json
          from pathlib import Path
          import sys
          from openapi_to_rust_bindings import read_bindings
          from rust_sdk_compiler import OpenApi, GenerationError

          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'tooling/pipeline/mistral'))
          import sdk_autoproject as a

          openapi = OpenApi.load(ROOT / 'tooling/sources/openapi/openapi.yaml')
          rust = read_bindings(ROOT / 'src/generated')
          schemas = dict(openapi.schemas)
          for name, schema in sorted(openapi.schemas.items()):
              if schema.get('allOf'):
                  try:
                      schemas[name] = openapi.object_schema(name)
                  except GenerationError as exc:
                      print(f'NORMALIZE_FAIL {name}: {exc}')

          for raw in ('ConversationAppendRequest', 'ConversationRestartRequest', 'ConversationRequest'):
              schema = schemas[raw]
              fields = {f.name.removeprefix('r#'): f for f in rust.fields(raw)}
              print(f'\nMODEL {raw}')
              print('PROPERTIES', sorted(schema.get('properties', {})))
              print('RAW_FIELDS', sorted(fields))
              print('REQUIRED', sorted(schema.get('required', [])))
              models = {}
              for field, field_schema in sorted(schema.get('properties', {}).items()):
                  if field not in fields:
                      print(f'FIELD {field}: missing raw')
                      continue
                  if field not in set(schema.get('required', [])) and a._omittable_singleton(field_schema, fields[field].type, schemas, rust):
                      print(f'FIELD {field}: omittable_singleton raw={fields[field].type}')
                      continue
                  before = set(models)
                  adapter, reason = a._request_field_adapter(
                      models, schemas, field_schema, fields[field].type, rust, (raw,), raw, (field,)
                  )
                  print(f'FIELD {field}: raw={fields[field].type} adapter={adapter} reason={reason} new_models={sorted(set(models)-before)}')
                  if reason:
                      break
              models2 = {}
              result, reason = a._ensure_request_model(models2, schemas, raw, rust)
              print(f'RESULT {raw}: adapter={result} reason={reason} models={sorted(models2)}')
          PY

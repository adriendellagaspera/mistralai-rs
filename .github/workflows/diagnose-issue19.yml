name: Diagnose issue 19 request gaps
on:
  push:
    branches: [issue-19-allof-request-projection]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-19-allof-request-projection
      - name: Bootstrap focused tooling
        run: |
          set -euo pipefail
          python3 -m venv .diag-venv
          .diag-venv/bin/pip install -q ruamel.yaml==0.18.6 tree-sitter==0.25.2 tree-sitter-rust==0.24.0 jsonschema==4.23.0
          git clone -q https://github.com/adriendellagaspera/mistralai-rs.git /tmp/bindings
          git -C /tmp/bindings checkout -q 394600cee5c3955b51c545c05986814f7a7ddd1c
          .diag-venv/bin/pip install -q --no-deps /tmp/bindings
          git clone -q https://github.com/adriendellagaspera/mistralai-rs.git /tmp/compiler
          git -C /tmp/compiler checkout -q 87300dfcb69ad8a86deb09c3ffeccd6c62e803bf
          .diag-venv/bin/pip install -q --no-deps /tmp/compiler
      - name: Print unresolved union shapes
        run: |
          .diag-venv/bin/python - <<'PY'
          import pprint
          from pathlib import Path
          from openapi_to_rust_bindings import read_bindings
          from rust_sdk_compiler import OpenApi
          root = Path.cwd()
          api = OpenApi.load(root / 'tooling/sources/openapi/openapi.yaml')
          rust = read_bindings(root / 'src/generated')

          print('\nSCHEMA CompletionArgs.stop')
          pprint.pp(api.schemas['CompletionArgs']['properties']['stop'])
          print('\nENUM CompletionArgsStop')
          for variant in rust.enums.get('CompletionArgsStop', ()):
              print(variant)
          print('ALIAS CompletionArgsStop', rust.aliases.get('CompletionArgsStop'))

          print('\nSCHEMA ConversationInputs')
          pprint.pp(api.schemas['ConversationInputs'])
          print('\nENUM ConversationInputs')
          for variant in rust.enums.get('ConversationInputs', ()):
              print(variant)
          print('ALIAS ConversationInputs', rust.aliases.get('ConversationInputs'))

          refs = []
          for branch in api.schemas['ConversationInputs'].get('anyOf', []):
              ref = branch.get('$ref')
              if ref:
                  refs.append(ref.rsplit('/', 1)[-1])
          for ref in refs:
              print('\nREF', ref)
              pprint.pp(api.schemas.get(ref))
              print('ALIAS', rust.aliases.get(ref))
              print('ENUM')
              for variant in rust.enums.get(ref, ()):
                  print(variant)
          PY
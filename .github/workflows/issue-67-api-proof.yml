name: Issue 67 API proof

on:
  push:
    branches: [issue-67-openapi-overlays]

permissions:
  contents: write

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-67-openapi-overlays
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .tools
          key: tools-api-${{ runner.os }}-${{ hashFiles('tooling/sources/lock.json') }}
      - name: Review generated public API changes
        env:
          SDK_API_BASE: 5de68845f73e464c827e5bc918a6bde57b46f48b
        run: python3 tooling/quality/api_surface.py --base "$SDK_API_BASE" --rustdoc
      - name: Remove one-shot workflow
        if: always()
        run: rm .github/workflows/issue-67-api-proof.yml
      - name: Commit cleanup
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "ci: remove issue 67 API proof"
          git push origin HEAD:issue-67-openapi-overlays

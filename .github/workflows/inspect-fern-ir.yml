name: Inspect Fern IR

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-fern-ir
  cancel-in-progress: true

jobs:
  inspect:
    name: Export pinned Fern IR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install --global fern-api@5.112.0 # zizmor: ignore[adhoc-packages]
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Prepare the exact production Fern input
        run: |
          python3 sdk-build/fern/prepare_fern_source.py \
            sdk-build/openapi/published.yaml \
            sdk-build/fern/compatible.yaml \
            sdk-build/fern/compatibility-report.json
          python3 sdk-build/sdk_surface/sdk_surface.py compile \
            --source sdk-build/fern/compatible.yaml \
            --policy sdk-build/fern/policy.yaml \
            --output sdk-build/fern/fern/openapi.json \
            --resolution sdk-build/fern/resolution.json
      - name: Export Fern IR
        working-directory: sdk-build/fern
        run: fern ir fern-ir.json --language rust --disable-examples --from-openapi
      - name: Upload IR and exact input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fern-ir-request-type-audit
          path: |
            sdk-build/fern/fern-ir.json
            sdk-build/fern/fern/openapi.json
            sdk-build/fern/resolution.json
          if-no-files-found: error
          retention-days: 7

name: Probe native Fern Rust #197 types
on:
  push:
    branches: [fix/remove-197-workarounds]
    paths: ['.github/workflows/probe-197-codegen.yml']
  workflow_dispatch:
permissions: {}
jobs:
  native-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        mode: ['ipa-named', 'responses']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install --global fern-api@5.190.0 # zizmor: ignore[adhoc-packages]
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Test native Rust generation (no #197 type workaround)
        env:
          FERN_197_PROBE_MODE: ${{ matrix.mode }}
        run: bash sdk-build/fern/build.sh
      - name: Compare generated Rust to current implementation
        env:
          FERN_197_PROBE_MODE: ${{ matrix.mode }}
        run: |
          echo "=== Updated types ==="
          find sdk-build/fern/generated/src/api/types -iname '*ipa*' -o -iname '*responses*frame*'
          echo "=== IPA type ==="
          sed -n '1,120p' sdk-build/fern/generated/src/api/types/ipa_phoneme.rs
          echo "=== Rust diff summary ==="
          diff -qr src sdk-build/fern/generated/src | head -80 || true

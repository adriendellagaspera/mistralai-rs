name: Materialize release

on:
  push:
    branches:
      - release/0.5.0

permissions:
  contents: write

concurrency:
  group: materialize-release-0.5.0
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: npm install --global fern-api@5.112.0
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: |
          bash sdk-build/fern/generate.sh
          cargo generate-lockfile
      - name: Commit exact generated output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add src Cargo.lock sdk-build/fern/inventory.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: regenerate Fern SDK for 0.5.0'
          gh auth setup-git
          git push origin HEAD:release/0.5.0

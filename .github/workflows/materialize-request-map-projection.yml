name: Materialize request map projection
on:
  push:
    branches: [issue-19-request-projection-followup]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply structural projection increment
        run: python3 scripts/materialize_request_map_projection.py
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools
            target
          key: sdk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'codegen.lock') }}
      - name: Regenerate facade
        run: python3 scripts/codegen.py generate
      - name: Refresh reviewed probe baseline
        run: |
          PYTHON=$(echo .tools/python-sdk-codegen-*/bin/python)
          "$PYTHON" - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          root = Path.cwd()
          sys.path.insert(0, str(root / 'codegen'))
          sys.path.insert(0, str(root / 'scripts'))
          import sdk_codegen as compiler
          from probe_sdk_coverage import probes
          openapi = compiler.OpenApiIndex.load(root / 'spec/openapi.yaml')
          rust = compiler.RustIndex.load(root / 'src/generated')
          configured = json.loads((root / 'codegen/sdk-semantics.json').read_text())
          configured, _ = compiler.expand_manifest(
              openapi,
              configured,
              json.loads((root / 'codegen/sdk-taxonomy.json').read_text()),
              json.loads((root / 'src/generated/coverage.json').read_text()),
              rust,
          )
          modules, rejected = probes(openapi, rust, configured)
          report = {'generated_candidates': sorted(modules), 'rejected_candidates': rejected}
          digest = hashlib.sha256(json.dumps(report, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          baseline = {
              'schema_version': 1,
              'generated_candidates': len(modules),
              'rejected_candidates': len(rejected),
              'report_sha256': digest,
          }
          (root / 'codegen/sdk-probe-baseline.json').write_text(json.dumps(baseline, indent=2) + '\n')
          print(json.dumps(baseline, indent=2))
          PY
      - name: Validate complete repository
        run: bash scripts/validate.sh
      - name: Remove temporary analysis and materialization scaffolding
        run: |
          rm -f \
            .github/workflows/analyze-request-projection.yml \
            .github/workflows/materialize-request-map-projection.yml \
            scripts/analyze_request_projection_debt.py \
            scripts/materialize_request_map_projection.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: project generated request maps structurally'
          git push origin HEAD:issue-19-request-projection-followup

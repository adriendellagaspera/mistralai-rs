name: Track Facade Raw Backend

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/update-facade-backend.yml
      - scripts/facade_backend_compat.py

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-facade-backend
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout facade package and resolve backend revisions
        id: backend
        run: |
          git fetch origin refs/heads/openapi-to-rust-facade:refs/remotes/origin/openapi-to-rust-facade
          rm -rf .facade-package
          git worktree add --detach .facade-package origin/openapi-to-rust-facade
          baseline="$(python3 -c 'import json; print(json.load(open(".facade-package/COMPATIBILITY.json"))["backend"]["commit"])')"
          candidate="$(git ls-remote https://github.com/gpu-cli/openapi-to-rust.git refs/heads/main | awk '{print $1}')"
          test -n "$candidate"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          if [ "$baseline" = "$candidate" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v4
        if: steps.backend.outputs.changed == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .tools/facade-backends
          key: facade-backends-${{ runner.os }}-${{ steps.backend.outputs.baseline }}-${{ steps.backend.outputs.candidate }}
          restore-keys: |
            facade-backends-${{ runner.os }}-

      - name: Install and test pinned facade package
        run: |
          python3 -m venv .tools/facade-sync-python
          .tools/facade-sync-python/bin/python -m pip install --disable-pip-version-check .facade-package
          .tools/facade-sync-python/bin/python -m unittest discover -s .facade-package/tests -p 'test_*.py'

      - name: Build baseline and candidate generators
        if: steps.backend.outputs.changed == 'true'
        run: |
          build_generator() {
            commit="$1"
            install="$PWD/.tools/facade-backends/$commit"
            binary="$install/bin/openapi-to-rust"
            if [ ! -x "$binary" ]; then
              source="$RUNNER_TEMP/openapi-to-rust-$commit"
              rm -rf "$source"
              git init "$source"
              git -C "$source" fetch --depth=1 https://github.com/gpu-cli/openapi-to-rust.git "$commit"
              git -C "$source" checkout --detach FETCH_HEAD
              cargo install --locked --path "$source" --root "$install"
            fi
          }
          build_generator '${{ steps.backend.outputs.baseline }}'
          build_generator '${{ steps.backend.outputs.candidate }}'

      - name: Compare raw and facade output
        if: steps.backend.outputs.changed == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          extra=()
          if [ "$EVENT_NAME" != 'pull_request' ]; then
            extra+=(--update-compatibility)
          fi
          .tools/facade-sync-python/bin/python scripts/facade_backend_compat.py \
            --facade-root .facade-package \
            --baseline-generator ".tools/facade-backends/${{ steps.backend.outputs.baseline }}/bin/openapi-to-rust" \
            --candidate-generator ".tools/facade-backends/${{ steps.backend.outputs.candidate }}/bin/openapi-to-rust" \
            --candidate-commit '${{ steps.backend.outputs.candidate }}' \
            --report "$RUNNER_TEMP/facade-backend-report.md" \
            "${extra[@]}"

      - name: Publish compatibility summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/facade-backend-report.md" ]; then
            cat "$RUNNER_TEMP/facade-backend-report.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ '${{ steps.backend.outputs.changed }}' = 'false' ]; then
            echo 'Facade backend is already pinned to upstream main.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create or update reviewed backend-sync PR
        if: steps.backend.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd .facade-package
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B automation/facade-backend-sync
          git add COMPATIBILITY.json README.md
          if git diff --cached --quiet; then
            echo 'No compatibility metadata changed.'
            exit 0
          fi
          version="$(python3 -c 'import json; print(json.load(open("COMPATIBILITY.json"))["backend"]["version"])')"
          git commit -m "chore: validate openapi-to-rust $version"
          git push --force origin HEAD:automation/facade-backend-sync
          pr="$(gh pr list --repo "$REPO" --base openapi-to-rust-facade --head automation/facade-backend-sync --state open --json number --jq '.[0].number // empty')"
          title="chore: validate openapi-to-rust $version for facade"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/facade-backend-report.md"
          else
            gh pr create --repo "$REPO" --base openapi-to-rust-facade --head automation/facade-backend-sync --title "$title" --body-file "$RUNNER_TEMP/facade-backend-report.md"
          fi

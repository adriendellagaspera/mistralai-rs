name: Materialize issue 19 mixed request unions
on:
  push:
    branches: [issue-19-allof-request-projection]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-19-allof-request-projection
          fetch-depth: 0
      - name: Apply generic mixed-union projection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tooling/pipeline/mistral/sdk_autoproject.py')
          text = path.read_text()

          marker = '''def _ensure_union_model(models: dict[str, Any], schemas: dict[str, Any], schema: dict[str, Any],\n                        raw: str, rust: Any, resolving: tuple[str, ...]) -> tuple[str | None, str | None]:\n'''
          helpers = '''def _expand_raw_alias(syntax: Type, rust: Any, seen: tuple[str, ...] = ()) -> Type | None:\n    if syntax.spelling not in rust.aliases:\n        return syntax\n    if syntax.spelling in seen:\n        return None\n    return _expand_raw_alias(\n        rust.aliases[syntax.spelling], rust, (*seen, syntax.spelling)\n    )\n\n\ndef _primitive_union_payload(schema: dict[str, Any]) -> str | None:\n    if "$ref" in schema or "enum" in schema or "const" in schema or "format" in schema:\n        return None\n    return {\n        "string": "String",\n        "integer": "i64",\n        "number": "f64",\n        "boolean": "bool",\n    }.get(schema.get("type"))\n\n\n'''
          if marker not in text:
              raise SystemExit('union helper marker not found')
          text = text.replace(marker, helpers + marker, 1)

          start = text.index(marker)
          end_marker = '\n\ndef _request_field_adapter('
          end = text.index(end_marker, start)
          new = '''def _ensure_union_model(models: dict[str, Any], schemas: dict[str, Any], schema: dict[str, Any],\n                        raw: str, rust: Any, resolving: tuple[str, ...]) -> tuple[str | None, str | None]:\n    existing = _existing_model_by_raw(models, raw, False)\n    if existing:\n        return existing, None\n    branches = schema.get("oneOf", []) or schema.get("anyOf", [])\n    non_null = [branch for branch in branches if branch.get("type") != "null"]\n    if len(non_null) < 2 or raw not in rust.enums:\n        return None, "request_model_projection"\n    variants = rust.enums[raw]\n    if any(variant.payload is None for variant in variants):\n        return None, "request_model_projection"\n    by_payload = {variant.payload: variant.name for variant in variants}\n    if len(by_payload) != len(variants):\n        return None, "request_model_projection"\n\n    expected: list[tuple[dict[str, Any], str, str | None]] = []\n    references: list[str] = []\n    for branch in non_null:\n        reference = _schema_ref(branch)\n        payload = reference or _primitive_union_payload(branch)\n        if payload is None:\n            return None, "request_model_projection"\n        expected.append((branch, payload, reference))\n        if reference is not None:\n            references.append(reference)\n    payloads = [payload for _, payload, _ in expected]\n    if len(set(payloads)) != len(payloads) or set(payloads) != set(by_payload):\n        return None, "request_model_projection"\n\n    discriminator = schema.get("discriminator", {})\n    mapping = discriminator.get("mapping", {}) if isinstance(discriminator, dict) else {}\n    tags_by_ref = {\n        value.rsplit("/", 1)[-1]: tag\n        for tag, value in mapping.items()\n        if isinstance(value, str)\n    }\n    if mapping and (len(references) != len(expected) or set(tags_by_ref) != set(references)):\n        return None, "request_model_projection"\n\n    facade_variants: dict[str, Any] = {}\n    seen_public: set[str] = set()\n    for branch, payload, reference in expected:\n        adapter = None\n        if reference is not None:\n            adapter, reason = _request_field_adapter(\n                models, schemas, branch, payload, rust, resolving, reference, ()\n            )\n            if reason:\n                return None, reason\n        label = tags_by_ref.get(reference, reference) if reference is not None else branch.get("type")\n        public = _pascal(str(label).lower() if reference in tags_by_ref else str(label))\n        if not public or public in seen_public:\n            return None, "request_model_projection"\n        seen_public.add(public)\n        facade_variants[by_payload[payload]] = (\n            {"name": public, "adapter": adapter} if adapter else public\n        )\n\n    name = _union_name(raw)\n    if name in models and models[name].get("raw", name) != raw:\n        return None, "request_model_projection"\n    models[name] = {"raw": raw, "simple_union": {"variants": facade_variants}}\n    return name, None\n'''
          text = text[:start] + new + text[end:]

          old_array = '''    if schema.get("type") == "array":\n        inner = syntax.unary("Vec")\n        if inner is None:\n            return None, "request_model_projection"\n        return _request_field_adapter(models, schemas, schema.get("items", {}), inner.spelling, rust, resolving, root, (*path, "items"))\n'''
          new_array = '''    if schema.get("type") == "array":\n        expanded = _expand_raw_alias(syntax, rust)\n        inner = expanded.unary("Vec") if expanded is not None else None\n        if inner is None:\n            return None, "request_model_projection"\n        return _request_field_adapter(models, schemas, schema.get("items", {}), inner.spelling, rust, resolving, root, (*path, "items"))\n'''
          if old_array not in text:
              raise SystemExit('array adapter block not found')
          text = text.replace(old_array, new_array, 1)

          old_ref = '''    if reference:\n        target = schemas.get(reference, {})\n        if target.get("type") == "string" and target.get("enum"):\n'''
          new_ref = '''    if reference:\n        target = schemas.get(reference, {})\n        if target.get("oneOf") or target.get("anyOf"):\n            if syntax.spelling != reference:\n                return None, "request_model_projection"\n            return _ensure_union_model(models, schemas, target, syntax.spelling, rust, resolving)\n        if target.get("type") == "array":\n            return _request_field_adapter(\n                models, schemas, target, syntax.spelling, rust, resolving, reference, ()\n            )\n        if target.get("type") == "string" and target.get("enum"):\n'''
          if old_ref not in text:
              raise SystemExit('reference adapter block not found')
          text = text.replace(old_ref, new_ref, 1)
          path.write_text(text)

          tests = Path('tooling/tests/test_sdk_autoproject.py')
          text = tests.read_text()
          marker = '    def test_projects_discriminated_request_union_without_raw_type_leaks(self):\n'
          test = '''    def test_projects_mixed_primitive_and_referenced_request_unions(self):\n        api = FakeOpenApi()\n        api.schemas.update({\n            "CreateThing": {\n                "type": "object", "required": ["input"],\n                "properties": {\n                    "input": {"$ref": "#/components/schemas/InputChoice"},\n                    "version": {\n                        "anyOf": [\n                            {"type": "string"},\n                            {"type": "integer"},\n                            {"type": "null"},\n                        ]\n                    },\n                },\n            },\n            "InputChoice": {\n                "anyOf": [\n                    {"type": "string"},\n                    {"$ref": "#/components/schemas/InputEntries"},\n                ]\n            },\n            "InputEntries": {\n                "type": "array",\n                "items": {\n                    "oneOf": [\n                        {"$ref": "#/components/schemas/TextInput"},\n                        {"$ref": "#/components/schemas/NumberInput"},\n                    ]\n                },\n            },\n            "TextInput": {\n                "type": "object", "required": ["text"],\n                "properties": {"text": {"type": "string"}},\n            },\n            "NumberInput": {\n                "type": "object", "required": ["value"],\n                "properties": {"value": {"type": "integer"}},\n            },\n        })\n        fields = {\n            "CreateThing": (\n                SimpleNamespace(name="input", type="InputChoice"),\n                SimpleNamespace(name="version", type="Option<Option<VersionChoice>>"),\n            ),\n            "TextInput": (SimpleNamespace(name="text", type="String"),),\n            "NumberInput": (SimpleNamespace(name="value", type="i64"),),\n        }\n        enums = {\n            "InputChoice": (\n                SimpleNamespace(name="String", payload="String"),\n                SimpleNamespace(name="InputEntries", payload="InputEntries"),\n            ),\n            "InputEntryUnion": (\n                SimpleNamespace(name="TextInput", payload="TextInput"),\n                SimpleNamespace(name="NumberInput", payload="NumberInput"),\n            ),\n            "VersionChoice": (\n                SimpleNamespace(name="String", payload="String"),\n                SimpleNamespace(name="Integer", payload="i64"),\n            ),\n        }\n        aliases = {"InputEntries": parse_type("Vec<InputEntryUnion>")}\n        rust = SimpleNamespace(\n            structs=set(fields), aliases=aliases, enums=enums,\n            symbol_paths={name: "types" for name in (*fields, *enums, *aliases)},\n            fields=lambda name: fields[name],\n        )\n        expanded, report = sdk_autoproject.expand_manifest(\n            api, manifest(), {"operations": {"create_thing": ["things.create"]}},\n            raw_coverage("create_thing"), rust,\n        )\n        self.assertEqual(1, report["added_count"])\n        request = expanded["models"]["CreateThingParams"]\n        self.assertEqual(\n            {"input": "InputChoiceValue", "version": "VersionChoiceValue"},\n            request["adapters"],\n        )\n        self.assertEqual(\n            {\n                "String": "String",\n                "InputEntries": {"name": "InputEntries", "adapter": "InputEntryUnionValue"},\n            },\n            expanded["models"]["InputChoiceValue"]["simple_union"]["variants"],\n        )\n        self.assertEqual(\n            {"String": "String", "Integer": "Integer"},\n            expanded["models"]["VersionChoiceValue"]["simple_union"]["variants"],\n        )\n\n'''
          if marker not in text:
              raise SystemExit('union test insertion point not found')
          text = text.replace(marker, test + marker, 1)
          tests.write_text(text)
          PY
      - name: Regenerate pinned SDK
        run: python3 tooling/pipeline/build.py generate
      - name: Refresh reviewed probe baseline
        run: |
          set -euo pipefail
          PYTHON=$(find .tools -path '*/bin/python' | grep 'python-sdk-tooling' | head -1)
          "$PYTHON" - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          from openapi_to_rust_bindings import read_bindings
          from rust_sdk_compiler import OpenApi

          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'tooling/pipeline/mistral'))
          sys.path.insert(0, str(ROOT / 'tooling/quality'))
          from sdk_autoproject import expand_manifest
          from probe import probes

          openapi = OpenApi.load(ROOT / 'tooling/sources/openapi/openapi.yaml')
          bindings = read_bindings(ROOT / 'src/generated')
          configured = json.loads((ROOT / 'tooling/pipeline/semantics.json').read_text())
          configured, projection = expand_manifest(
              openapi,
              configured,
              json.loads((ROOT / 'tooling/sources/taxonomy.json').read_text()),
              json.loads((ROOT / 'src/generated/coverage.json').read_text()),
              bindings,
          )
          print('PROJECTION=' + json.dumps(projection, sort_keys=True))
          modules, rejected = probes(openapi, bindings, configured)
          report = {
              'generated_candidates': sorted(modules),
              'rejected_candidates': rejected,
          }
          digest = hashlib.sha256(
              json.dumps(report, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          baseline = {
              'schema_version': 1,
              'generated_candidates': len(modules),
              'rejected_candidates': len(rejected),
              'report_sha256': digest,
          }
          (ROOT / 'tooling/quality/probe-baseline.json').write_text(
              json.dumps(baseline, indent=2) + '\n'
          )
          print(json.dumps(report, indent=2))
          print('BASELINE=' + json.dumps(baseline, sort_keys=True))
          PY
      - name: Validate full consumer gate
        run: bash tooling/quality/validate.sh
      - name: Commit materialized consumer
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/materialize-issue19-allof.yml
          git add -A
          git commit -m 'feat: project mixed request unions generically'
          git push origin HEAD:issue-19-allof-request-projection

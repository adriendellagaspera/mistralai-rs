[package]
name = "mistralai-sdk"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
description = "Unofficial Mistral AI SDK reproducibly generated from the official OpenAPI specification"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adriendellagaspera/mistralai-rs"
readme = "README.md"
publish = ["crates-io"]
keywords = ["mistral", "openapi", "sdk", "ai"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "mistralai"
doctest = false

# Keep aligned with the pinned Fern Rust generator output.
[dependencies]
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
pin-project = { version = "1.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "rustls-tls"] }
reqwest-sse = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }

[features]
default = ["multipart", "sse"]
multipart = ["reqwest/multipart"]
sse = ["reqwest-sse", "pin-project"]

[package]
name = "mistralai-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Unofficial Mistral AI SDK reproducibly generated from the official OpenAPI specification"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adriendellagaspera/mistralai-rs"
readme = "README.md"
keywords = ["mistral", "openapi", "sdk", "ai"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "mistralai"

# Keep aligned with src/generated/REQUIRED_DEPS.toml.
[dependencies]
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls", "stream", "multipart"] }
reqwest-middleware = { version = "0.5", features = ["query", "multipart"] }
reqwest-retry = "0.9"
reqwest-tracing = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
bytes = { version = "1", features = ["serde"] }
futures-util = "0.3"
async-stream = "0.3"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

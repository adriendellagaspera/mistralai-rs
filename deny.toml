[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
    { crate = "native-tls", reason = "the SDK intentionally uses rustls" },
    { crate = "openssl", reason = "the SDK intentionally uses rustls" },
    { crate = "openssl-sys", reason = "the SDK intentionally uses rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
]
exceptions = []

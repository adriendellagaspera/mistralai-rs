api:
  specs:
    - openapi: ./openapi.json

default-group: rust-sdk

groups:
  rust-sdk:
    generators:
      - name: fernapi/fern-rust-sdk
        version: 0.48.0
        config:
          clientClassName: Mistral
          crateName: mistralai_sdk
          crateVersion: "0.5.0"
          packageDescription: "Unofficial asynchronous Rust SDK for Mistral AI"
          packageLicense: "MIT OR Apache-2.0"
          packageRepository: "https://github.com/adriendellagaspera/mistralai-rs"
        output:
          location: local-file-system
          path: ../generated

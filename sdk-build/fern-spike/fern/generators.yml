# Experimental only. See rust-sdk-generator#234.
api:
  specs:
    - openapi: ./openapi.yaml

default-group: rust-sdk

groups:
  rust-sdk:
    generators:
      - name: fernapi/fern-rust-sdk
        version: 0.48.0
        disable-examples: true
        output:
          location: local-file-system
          path: ../generated

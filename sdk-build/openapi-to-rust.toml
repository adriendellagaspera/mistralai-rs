[generator]
spec_path = "openapi/published.yaml"
overlays = ["openapi/overlays/public-288.overlay.yaml"]
overlay_output = "openapi/overlaid.json"
output_dir = "../src/generated"
module_name = "mistralai"
binding_manifest = true

[features]
enable_async_client = true

[http_client]
base_url = "https://api.mistral.ai"

[http_client.retry]
# Avoid transparently retrying billable POST requests.
max_retries = 0

[http_client.auth]
type = "Bearer"
header_name = "Authorization"

[client]
prune_models = false

